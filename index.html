<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>A-to-Z VIN Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px;
  background: #0b0d10;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 4px 0;
  font-size: 24px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 12px;
}

#cameraBox {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: auto;
  background: black;
  overflow: hidden;
  border-radius: 14px;
}

video {
  width: 100%;
  display: block;
}

#shadeTop,
#shadeBottom {
  position: absolute;
  left: 0;
  right: 0;
  background: rgba(0,0,0,.38);
  pointer-events: none;
}

#shadeTop {
  top: 0;
  height: 42%;
}

#shadeBottom {
  bottom: 0;
  height: 42%;
}

#vinGuide {
  position: absolute;
  left: 3%;
  right: 3%;
  top: 42%;
  height: 16%;

  min-height: 62px;

  border: 3px solid #00ff88;
  border-radius: 9px;

  box-shadow:
    0 0 12px rgba(0,255,136,.7);

  pointer-events: none;
}

#guideText {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(42% - 30px);

  color: #00ff88;
  font-size: 13px;
  font-weight: bold;

  text-shadow: 0 1px 4px black;
}

#scanLine {
  display: none;

  position: absolute;
  left: 4%;
  right: 4%;
  top: 43%;

  height: 2px;

  background: #00ff88;

  box-shadow:
    0 0 10px #00ff88;

  animation: scanning 1s infinite alternate ease-in-out;
}

@keyframes scanning {
  from {
    transform: translateY(3px);
  }

  to {
    transform: translateY(55px);
  }
}

#status {
  max-width: 700px;
  margin: 14px auto 5px;
  min-height: 24px;

  font-size: 16px;
  color: #ddd;
}

#smallStatus {
  max-width: 700px;
  margin: 5px auto 12px;

  min-height: 18px;

  font-size: 13px;
  color: #888;
}

#result {
  display: none;

  max-width: 700px;

  margin: 14px auto;
  padding: 18px;

  border-radius: 12px;

  background: #1a1d21;
  border: 1px solid #333;
}

.success {
  color: #00ff88;
  font-weight: bold;
  font-size: 14px;
}

#vinResult {
  margin-top: 9px;

  font-size: 23px;
  font-weight: bold;

  letter-spacing: 1.4px;
  word-break: break-all;
}

#vehicleResult {
  margin-top: 12px;

  font-size: 19px;
  color: #00ff88;
}

button {
  width: 100%;
  max-width: 700px;

  margin-top: 10px;
  padding: 16px;

  border: 0;
  border-radius: 10px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#confirmButton {
  display: none;
  background: #00b86b;
  color: white;
}

#retryButton {
  display: none;
  background: #333;
  color: white;
}

#manualButton {
  background: transparent;
  color: #aaa;
  border: 1px solid #444;
}

#manualBox {
  display: none;

  max-width: 700px;

  margin: 12px auto;
  padding: 14px;

  border-radius: 10px;

  background: #191c20;
}

#manualVIN {
  width: 100%;
  padding: 14px;

  background: #0d0f12;
  color: white;

  border: 1px solid #555;
  border-radius: 8px;

  font-size: 18px;
  letter-spacing: 1px;

  text-transform: uppercase;
}

#manualSubmit {
  background: #1478ff;
  color: white;
}

canvas {
  display: none;
}
</style>
</head>

<body>

<h1>A-to-Z Yard</h1>

<div class="subtitle">
  Automatic VIN Scanner
</div>


<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="shadeTop"></div>
  <div id="shadeBottom"></div>

  <div id="guideText">
    PLACE ONLY ONE VIN INSIDE THE BOX
  </div>

  <div id="vinGuide"></div>

  <div id="scanLine"></div>

</div>


<div id="status">
  Starting camera...
</div>

<div id="smallStatus">
  No button needed — scanning starts automatically.
</div>


<div id="result">

  <div class="success">
    ✓ VIN FOUND
  </div>

  <div id="vinResult"></div>

  <div id="vehicleResult"></div>

</div>


<button id="confirmButton">
  CONFIRM & CONTINUE
</button>

<button id="retryButton">
  SCAN AGAIN
</button>

<button id="manualButton">
  ENTER VIN MANUALLY
</button>


<div id="manualBox">

  <input
    id="manualVIN"
    maxlength="17"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="17-CHARACTER VIN">

  <button id="manualSubmit">
    USE VIN
  </button>

</div>


<canvas id="captureCanvas"></canvas>
<canvas id="processCanvas"></canvas>


<script>

/* ==================================================
   APPSHEET SETTINGS
================================================== */

const APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";

const FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";


/* ==================================================
   ELEMENTS
================================================== */

const video =
  document.getElementById("video");

const captureCanvas =
  document.getElementById("captureCanvas");

const processCanvas =
  document.getElementById("processCanvas");

const statusBox =
  document.getElementById("status");

const smallStatus =
  document.getElementById("smallStatus");

const scanLine =
  document.getElementById("scanLine");

const resultBox =
  document.getElementById("result");

const vinResult =
  document.getElementById("vinResult");

const vehicleResult =
  document.getElementById("vehicleResult");

const confirmButton =
  document.getElementById("confirmButton");

const retryButton =
  document.getElementById("retryButton");

const manualButton =
  document.getElementById("manualButton");

const manualBox =
  document.getElementById("manualBox");

const manualVIN =
  document.getElementById("manualVIN");

const manualSubmit =
  document.getElementById("manualSubmit");


/* ==================================================
   STATE
================================================== */

let stream = null;

let worker = null;

let scanning = false;

let detectedVIN = "";

let detectedYear = "";

let detectedMake = "";

let detectedModel = "";

let scanRound = 0;

const votes = {};

const MAX_ROUNDS = 10;


/* ==================================================
   START CAMERA
================================================== */

async function startCamera() {

  try {

    statusBox.innerText =
      "Opening rear camera...";

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;

    await video.play();

    await waitForVideo();

    await configureCamera();

    statusBox.innerText =
      "Preparing VIN reader...";

    await prepareOCR();

    await sleep(300);

    beginAutomaticScanning();

  }

  catch (error) {

    console.error(error);

    statusBox.innerText =
      "Camera error: " +
      error.message;

    smallStatus.innerText =
      "You can enter the VIN manually below.";

  }

}


/* ==================================================
   WAIT FOR CAMERA
================================================== */

function waitForVideo() {

  return new Promise(
    function(resolve, reject) {

      let tries = 0;

      const timer =
        setInterval(
          function() {

            tries++;

            if (
              video.videoWidth > 0 &&
              video.videoHeight > 0
            ) {

              clearInterval(timer);
              resolve();

            }

            if (tries > 80) {

              clearInterval(timer);

              reject(
                new Error(
                  "Camera video did not start."
                )
              );

            }

          },
          100
        );

    }
  );

}


/* ==================================================
   CAMERA AUTOFOCUS
================================================== */

async function configureCamera() {

  try {

    const track =
      stream.getVideoTracks()[0];

    if (!track) {
      return;
    }

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    const advanced = [];


    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        focusMode: "continuous"
      });

    }


    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        exposureMode: "continuous"
      });

    }


    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        whiteBalanceMode: "continuous"
      });

    }


    if (advanced.length) {

      await track.applyConstraints({
        advanced: advanced
      });

    }

  }

  catch (error) {

    console.log(
      "Advanced camera settings unavailable.",
      error
    );

  }

}


/* ==================================================
   OCR WORKER
================================================== */

async function prepareOCR() {

  if (worker) {
    return;
  }


  worker =
    await Tesseract.createWorker(
      "eng"
    );


  await worker.setParameters({

    tessedit_char_whitelist:
      "ABCDEFGHJKLMNPRSTUVWXYZ0123456789",

    tessedit_pageseg_mode:
      "7"

  });

}


/* ==================================================
   AUTOMATIC SCANNING
================================================== */

function beginAutomaticScanning() {

  scanning = true;

  scanRound = 0;

  clearVotes();

  scanLine.style.display =
    "block";

  resultBox.style.display =
    "none";

  confirmButton.style.display =
    "none";

  retryButton.style.display =
    "none";

  manualButton.style.display =
    "block";

  statusBox.innerText =
    "Scanning automatically...";

  smallStatus.innerText =
    "Align all 17 characters inside the green box.";

  automaticLoop();

}


/* ==================================================
   SCAN LOOP
================================================== */

async function automaticLoop() {

  while (
    scanning &&
    scanRound < MAX_ROUNDS
  ) {

    scanRound++;


    smallStatus.innerText =
      "Reading VIN • pass " +
      scanRound;


    const source =
      captureROI();


    /*
      IMPORTANT:
      We process the SAME physical line
      several ways, but NEVER combine
      text from different OCR lines.
    */

    const modes = [
      "contrast",
      "threshold",
      "inverted"
    ];


    for (
      const mode of modes
    ) {

      if (!scanning) {
        return;
      }


      const image =
        preprocess(
          source,
          mode
        );


      const result =
        await worker.recognize(
          image
        );


      const rawText =
        String(
          result.data.text || ""
        );


      console.log(
        "OCR",
        scanRound,
        mode,
        rawText
      );


      const candidates =
        extractCandidates(
          rawText
        );


      for (
        const vin of candidates
      ) {

        addVote(vin);


        /*
          As soon as OCR sees the exact same
          candidate twice, verify it.
        */

        if (
          votes[vin] >= 2
        ) {

          statusBox.innerText =
            "Checking VIN...";


          const vehicle =
            await verifyWithNHTSA(
              vin
            );


          if (vehicle) {

            lockVIN(
              vin,
              vehicle
            );

            return;

          }

        }

      }

    }


    /*
      Small delay lets autofocus update
      before the next frame.
    */

    await sleep(180);

  }


  if (scanning) {

    scanning = false;

    scanLine.style.display =
      "none";


    statusBox.innerText =
      "Couldn't read the VIN clearly.";


    smallStatus.innerText =
      "Move closer, center one VIN and tap Scan Again.";


    retryButton.style.display =
      "block";

  }

}


/* ==================================================
   CAPTURE ONLY GREEN BOX
================================================== */

function captureROI() {

  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  /*
    The visible guide is approximately
    top 42% → 58%.

    We intentionally capture ONLY that
    horizontal strip.
  */

  const cropX =
    Math.floor(
      videoWidth * 0.03
    );

  const cropY =
    Math.floor(
      videoHeight * 0.42
    );

  const cropWidth =
    Math.floor(
      videoWidth * 0.94
    );

  const cropHeight =
    Math.floor(
      videoHeight * 0.16
    );


  /*
    Upscale OCR input.
  */

  const SCALE = 2;


  captureCanvas.width =
    cropWidth * SCALE;

  captureCanvas.height =
    cropHeight * SCALE;


  const ctx =
    captureCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    video,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    captureCanvas.width,
    captureCanvas.height

  );


  return captureCanvas;

}


/* ==================================================
   IMAGE PROCESSING
================================================== */

function preprocess(
  source,
  mode
) {

  processCanvas.width =
    source.width;

  processCanvas.height =
    source.height;


  const ctx =
    processCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.drawImage(
    source,
    0,
    0
  );


  const image =
    ctx.getImageData(
      0,
      0,
      processCanvas.width,
      processCanvas.height
    );


  const data =
    image.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =

      0.299 * data[i] +

      0.587 * data[i + 1] +

      0.114 * data[i + 2];


    let value;


    if (
      mode === "threshold"
    ) {

      value =
        gray > 145
          ? 255
          : 0;

    }

    else if (
      mode === "inverted"
    ) {

      value =
        gray > 145
          ? 0
          : 255;

    }

    else {

      value =
        (gray - 128) *
        1.9 +
        128;


      value =
        Math.max(
          0,
          Math.min(
            255,
            value
          )
        );

    }


    data[i] =
      value;

    data[i + 1] =
      value;

    data[i + 2] =
      value;

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  /*
    Return an independent canvas.
  */

  const output =
    document.createElement(
      "canvas"
    );


  output.width =
    processCanvas.width;

  output.height =
    processCanvas.height;


  output
    .getContext("2d")
    .drawImage(
      processCanvas,
      0,
      0
    );


  return output;

}


/* ==================================================
   EXTRACT VIN
================================================== */

function extractCandidates(rawText) {

  const candidates =
    new Set();


  /*
    NEVER merge all OCR lines.

    This fixes the exact problem where:
    "storage 175$"
    +
    another VIN
    became one fake 17-char result.
  */

  const lines =
    String(rawText)
      .toUpperCase()
      .split(/\r?\n/);


  for (
    let line of lines
  ) {

    line =
      line.trim();


    if (!line) {
      continue;
    }


    let clean =
      line.replace(
        /[^A-Z0-9]/g,
        ""
      );


    /*
      VIN cannot contain I, O or Q.

      These are common OCR mistakes.
    */

    clean =
      clean
        .replace(/O/g, "0")
        .replace(/Q/g, "0")
        .replace(/I/g, "1");


    /*
      Important:
      reject long lines instead of taking
      arbitrary windows from lots of text.
    */

    if (
      clean.length < 17 ||
      clean.length > 20
    ) {

      continue;

    }


    if (
      clean.length === 17
    ) {

      if (
        basicVINCheck(clean)
      ) {

        candidates.add(
          clean
        );

      }

      continue;

    }


    /*
      OCR sometimes adds 1–3 characters
      around the VIN.

      Only in that small case do we test
      17-character windows.
    */

    for (
      let i = 0;
      i <= clean.length - 17;
      i++
    ) {

      const possible =
        clean.substring(
          i,
          i + 17
        );


      if (
        basicVINCheck(
          possible
        )
      ) {

        candidates.add(
          possible
        );

      }

    }

  }


  return Array.from(
    candidates
  );

}


/* ==================================================
   BASIC VIN VALIDATION
================================================== */

function basicVINCheck(vin) {

  if (
    !/^[A-HJ-NPR-Z0-9]{17}$/.test(
      vin
    )
  ) {

    return false;

  }


  const uniqueChars =
    new Set(
      vin.split("")
    );


  if (
    uniqueChars.size < 6
  ) {

    return false;

  }


  /*
    Position 10 is model-year code.
    This removes many random OCR strings.
  */

  const yearCode =
    vin.charAt(9);


  if (
    !/^[A-HJ-NPR-TV-Y1-9]$/.test(
      yearCode
    )
  ) {

    return false;

  }


  return true;

}


/* ==================================================
   VOTING
================================================== */

function addVote(vin) {

  if (!votes[vin]) {

    votes[vin] = 0;

  }


  votes[vin]++;


  console.log(
    "VIN candidate:",
    vin,
    "votes:",
    votes[vin]
  );

}


function clearVotes() {

  for (
    const vin in votes
  ) {

    delete votes[vin];

  }

}


/* ==================================================
   NHTSA VERIFICATION
================================================== */

async function verifyWithNHTSA(
  vin
) {

  try {

    const url =

      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/" +

      encodeURIComponent(vin) +

      "?format=json";


    const response =
      await fetch(url);


    if (!response.ok) {

      return null;

    }


    const data =
      await response.json();


    if (
      !data.Results ||
      !data.Results.length
    ) {

      return null;

    }


    const vehicle =
      data.Results[0];


    /*
      A random 17-character string may still
      receive a response.

      We require meaningful vehicle data.
    */

    const year =
      String(
        vehicle.ModelYear || ""
      ).trim();


    const make =
      String(
        vehicle.Make || ""
      ).trim();


    if (
      !year ||
      !make
    ) {

      return null;

    }


    return {

      year:
        year,

      make:
        make,

      model:
        String(
          vehicle.Model || ""
        ).trim()

    };

  }

  catch (error) {

    console.error(
      "NHTSA verification failed:",
      error
    );


    return null;

  }

}


/* ==================================================
   LOCK VIN
================================================== */

function lockVIN(
  vin,
  vehicle
) {

  scanning = false;


  detectedVIN =
    vin;


  detectedYear =
    vehicle.year;


  detectedMake =
    vehicle.make;


  detectedModel =
    vehicle.model;


  scanLine.style.display =
    "none";


  vinResult.innerText =
    detectedVIN;


  vehicleResult.innerText =
    [
      detectedYear,
      detectedMake,
      detectedModel
    ]
    .filter(Boolean)
    .join(" ");


  resultBox.style.display =
    "block";


  statusBox.innerText =
    "VIN confirmed.";


  smallStatus.innerText =
    "Vehicle successfully identified.";


  confirmButton.style.display =
    "block";


  retryButton.style.display =
    "block";


  manualButton.style.display =
    "none";


  manualBox.style.display =
    "none";

}


/* ==================================================
   RETRY
================================================== */

retryButton.addEventListener(
  "click",
  function() {

    scanning = false;

    detectedVIN = "";

    detectedYear = "";

    detectedMake = "";

    detectedModel = "";


    vinResult.innerText = "";

    vehicleResult.innerText = "";


    resultBox.style.display =
      "none";


    confirmButton.style.display =
      "none";


    retryButton.style.display =
      "none";


    manualBox.style.display =
      "none";


    manualVIN.value = "";


    setTimeout(
      beginAutomaticScanning,
      200
    );

  }
);


/* ==================================================
   MANUAL ENTRY
================================================== */

manualButton.addEventListener(
  "click",
  function() {

    manualBox.style.display =
      manualBox.style.display === "block"
        ? "none"
        : "block";


    manualVIN.focus();

  }
);


manualVIN.addEventListener(
  "input",
  function() {

    this.value =
      this.value
        .toUpperCase()
        .replace(
          /[^A-HJ-NPR-Z0-9]/g,
          ""
        )
        .slice(
          0,
          17
        );

  }
);


manualSubmit.addEventListener(
  "click",
  async function() {

    const vin =
      manualVIN.value
        .trim()
        .toUpperCase();


    if (
      !basicVINCheck(vin)
    ) {

      statusBox.innerText =
        "Enter a valid 17-character VIN.";

      return;

    }


    statusBox.innerText =
      "Checking VIN...";


    const vehicle =
      await verifyWithNHTSA(
        vin
      );


    if (!vehicle) {

      statusBox.innerText =
        "VIN could not be verified.";

      return;

    }


    lockVIN(
      vin,
      vehicle
    );

  }
);


/* ==================================================
   CONFIRM → APPSHEET
================================================== */

confirmButton.addEventListener(
  "click",
  function() {

    if (!detectedVIN) {
      return;
    }


    statusBox.innerText =
      "Opening receiving form...";


    const defaults = {

      "VIN":
        detectedVIN,

      "Year":
        detectedYear,

      "Make":
        detectedMake,

      "Model":
        detectedModel

    };


    const appUrl =

      "https://www.appsheet.com/start/" +

      APP_ID +

      "#control=" +

      encodeURIComponent(
        FORM_VIEW
      ) +

      "&defaults=" +

      encodeURIComponent(
        JSON.stringify(
          defaults
        )
      ) +

      "&page=form";


    window.location.href =
      appUrl;

  }
);


/* ==================================================
   HELPERS
================================================== */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* ==================================================
   START
================================================== */

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
