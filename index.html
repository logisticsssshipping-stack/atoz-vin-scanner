<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>A-to-Z VIN Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
      font-size: 25px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 18px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: auto;
      background: black;
      overflow: hidden;
      border-radius: 14px;
    }

    video {
      width: 100%;
      display: block;
      background: black;
    }

    #vinGuide {
      position: absolute;

      left: 4%;
      right: 4%;

      top: 40%;

      height: 85px;

      border: 3px solid #00ff88;

      border-radius: 8px;

      pointer-events: none;
    }

    #guideLabel {
      position: absolute;

      left: 0;
      right: 0;

      top: calc(40% - 30px);

      color: #00ff88;

      font-weight: bold;

      font-size: 13px;

      text-shadow: 1px 1px 3px black;
    }

    button {

      width: 100%;

      max-width: 700px;

      padding: 16px;

      margin-top: 14px;

      border: 0;

      border-radius: 10px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
    }

    #scanButton {
      background: #1478ff;
      color: white;
    }

    #confirmButton {
      display: none;

      background: #00b86b;

      color: white;
    }

    #retryButton {
      display: none;

      background: #444;

      color: white;
    }

    #status {

      margin: 16px auto;

      max-width: 700px;

      min-height: 25px;

      color: #ddd;
    }

    #result {

      display: none;

      max-width: 700px;

      margin: 15px auto;

      padding: 18px;

      background: #222;

      border-radius: 12px;
    }

    #vinResult {

      margin-top: 8px;

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 1.5px;

      word-break: break-all;
    }

    #vehicleResult {

      margin-top: 12px;

      font-size: 19px;

      color: #00ff88;
    }

    canvas {
      display: none;
    }

  </style>

</head>


<body>


<h1>A-to-Z Yard</h1>

<div class="subtitle">
  Vehicle VIN Scanner
</div>


<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div id="guideLabel">
    PLACE 17-CHARACTER VIN INSIDE BOX
  </div>


  <div id="vinGuide"></div>

</div>


<button
  id="scanButton"
  disabled>
  STARTING CAMERA...
</button>


<div id="status">
  Requesting camera access...
</div>


<div id="result">

  <div>
    VIN DETECTED
  </div>

  <div id="vinResult"></div>

  <div id="vehicleResult"></div>

</div>


<button id="confirmButton">
  CONFIRM VIN & CONTINUE
</button>


<button id="retryButton">
  SCAN AGAIN
</button>


<canvas id="canvas"></canvas>


<script>


/* =========================================
   APPSHEET SETTINGS
========================================= */


const APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";


const FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";



/* =========================================
   ELEMENTS
========================================= */


const video =
  document.getElementById("video");


const canvas =
  document.getElementById("canvas");


const scanButton =
  document.getElementById("scanButton");


const confirmButton =
  document.getElementById("confirmButton");


const retryButton =
  document.getElementById("retryButton");


const statusBox =
  document.getElementById("status");


const resultBox =
  document.getElementById("result");


const vinResult =
  document.getElementById("vinResult");


const vehicleResult =
  document.getElementById("vehicleResult");



/* =========================================
   VARIABLES
========================================= */


let stream = null;


let detectedVIN = "";


let detectedYear = "";


let detectedMake = "";


let detectedModel = "";



/* =========================================
   CAMERA
========================================= */


async function startCamera() {

  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera not supported by this browser."
      );

    }


    statusBox.innerText =
      "Waiting for camera permission...";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    await waitForCamera();


    statusBox.innerText =
      "Camera ready. Place VIN inside green box.";


    scanButton.disabled =
      false;


    scanButton.innerText =
      "SCAN VIN";


  } catch (error) {


    console.error(error);


    statusBox.innerText =
      "CAMERA ERROR: " +
      error.message;


    scanButton.innerText =
      "CAMERA NOT AVAILABLE";

  }

}



function waitForCamera() {

  return new Promise(
    function(resolve, reject) {


      let tries = 0;


      const timer =
        setInterval(
          function() {


            tries++;


            if (
              video.videoWidth > 0 &&
              video.videoHeight > 0
            ) {


              clearInterval(timer);


              resolve();

            }


            if (tries > 60) {


              clearInterval(timer);


              reject(
                new Error(
                  "Camera opened but video was not ready."
                )
              );

            }


          },

          100
        );

    }
  );

}



/* =========================================
   SCAN VIN
========================================= */


scanButton.addEventListener(
  "click",
  scanVIN
);



async function scanVIN() {


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {


    statusBox.innerText =
      "Camera is not ready yet.";


    return;

  }


  scanButton.disabled =
    true;


  scanButton.innerText =
    "READING VIN...";


  statusBox.innerText =
    "Hold phone steady...";


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;



  const cropX =
    Math.floor(
      width * 0.03
    );


  const cropY =
    Math.floor(
      height * 0.34
    );


  const cropWidth =
    Math.floor(
      width * 0.94
    );


  const cropHeight =
    Math.floor(
      height * 0.32
    );



  canvas.width =
    cropWidth;


  canvas.height =
    cropHeight;



  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );



  ctx.drawImage(

    video,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    cropWidth,
    cropHeight

  );



  enhanceImage(

    ctx,

    cropWidth,

    cropHeight

  );



  try {


    const result =
      await Tesseract.recognize(

        canvas,

        "eng",

        {

          logger:
            function(message) {


              if (
                message.status ===
                "recognizing text"
              ) {


                const percent =
                  Math.round(
                    message.progress * 100
                  );


                statusBox.innerText =
                  "Reading VIN... " +
                  percent +
                  "%";

              }

            }

        }

      );



    const text =
      String(
        result.data.text || ""
      ).toUpperCase();



    console.log(
      "OCR RESULT:",
      text
    );



    const vin =
      findVIN(text);



    if (!vin) {


      statusBox.innerText =
        "VIN not detected. Move closer and try again.";


      scanButton.disabled =
        false;


      scanButton.innerText =
        "SCAN AGAIN";


      return;

    }



    detectedVIN =
      vin;



    vinResult.innerText =
      vin;



    resultBox.style.display =
      "block";



    statusBox.innerText =
      "VIN detected. Getting vehicle information...";



    await decodeVIN(vin);


  } catch (error) {


    console.error(error);


    statusBox.innerText =
      "SCAN ERROR: " +
      error.message;


    scanButton.disabled =
      false;


    scanButton.innerText =
      "SCAN AGAIN";

  }

}



/* =========================================
   IMAGE ENHANCEMENT
========================================= */


function enhanceImage(
  ctx,
  width,
  height
) {


  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    image.data;



  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {


    const gray =

      0.299 * data[i] +

      0.587 * data[i + 1] +

      0.114 * data[i + 2];



    const value =
      gray > 140
        ? 255
        : 0;



    data[i] =
      value;


    data[i + 1] =
      value;


    data[i + 2] =
      value;

  }



  ctx.putImageData(
    image,
    0,
    0
  );

}



/* =========================================
   FIND VIN
========================================= */


function findVIN(text) {


  const lines =
    text.split(
      /\r?\n/
    );



  for (
    let line of lines
  ) {


    const clean =
      line
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          ""
        );



    const match =
      clean.match(
        /[A-HJ-NPR-Z0-9]{17}/
      );



    if (match) {

      return match[0];

    }

  }



  const all =
    text
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );



  const match =
    all.match(
      /[A-HJ-NPR-Z0-9]{17}/
    );



  return match
    ? match[0]
    : null;

}



/* =========================================
   NHTSA VIN DECODER
========================================= */


async function decodeVIN(vin) {


  try {


    const url =

      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/" +

      encodeURIComponent(vin) +

      "?format=json";



    const response =
      await fetch(url);



    if (!response.ok) {

      throw new Error(
        "VIN decoder did not respond."
      );

    }



    const data =
      await response.json();



    if (
      !data.Results ||
      data.Results.length === 0
    ) {

      throw new Error(
        "Vehicle information not found."
      );

    }



    const vehicle =
      data.Results[0];



    detectedYear =
      vehicle.ModelYear || "";


    detectedMake =
      vehicle.Make || "";


    detectedModel =
      vehicle.Model || "";



    const vehicleName =
      [
        detectedYear,
        detectedMake,
        detectedModel
      ]
      .filter(Boolean)
      .join(" ");



    vehicleResult.innerText =
      vehicleName;



    statusBox.innerText =
      "Check VIN and vehicle details, then confirm.";



    scanButton.style.display =
      "none";


    confirmButton.style.display =
      "block";


    retryButton.style.display =
      "block";


  } catch (error) {


    console.error(error);


    statusBox.innerText =
      "VIN detected, but vehicle details could not be decoded.";


    vehicleResult.innerText =
      "VIN: " +
      detectedVIN;


    scanButton.style.display =
      "none";


    confirmButton.style.display =
      "block";


    retryButton.style.display =
      "block";

  }

}



/* =========================================
   CONFIRM → APPSHEET FORM
========================================= */


confirmButton.addEventListener(
  "click",
  function() {


    if (!detectedVIN) {


      statusBox.innerText =
        "No VIN detected.";


      return;

    }



    statusBox.innerText =
      "Opening vehicle receiving form...";



    const defaults = {

      "VIN":
        detectedVIN,

      "Year":
        detectedYear,

      "Make":
        detectedMake,

      "Model":
        detectedModel

    };



    const appUrl =

      "https://www.appsheet.com/start/" +

      APP_ID +

      "#control=" +

      encodeURIComponent(
        FORM_VIEW
      ) +

      "&defaults=" +

      encodeURIComponent(
        JSON.stringify(
          defaults
        )
      ) +

      "&page=form";



    window.location.href =
      appUrl;

  }

);



/* =========================================
   RETRY
========================================= */


retryButton.addEventListener(
  "click",
  function() {


    detectedVIN =
      "";


    detectedYear =
      "";


    detectedMake =
      "";


    detectedModel =
      "";



    vinResult.innerText =
      "";


    vehicleResult.innerText =
      "";



    resultBox.style.display =
      "none";


    confirmButton.style.display =
      "none";


    retryButton.style.display =
      "none";


    scanButton.style.display =
      "block";


    scanButton.disabled =
      false;


    scanButton.innerText =
      "SCAN VIN";


    statusBox.innerText =
      "Place VIN inside green box.";

  }

);



/* =========================================
   START
========================================= */


window.addEventListener(
  "load",
  startCamera
);


</script>


</body>

</html>
