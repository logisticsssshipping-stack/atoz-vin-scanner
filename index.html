<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>A-to-Z VIN Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      background: #000;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* Dark overlay */
    .shade {
      position: absolute;
      left: 0;
      right: 0;
      background: rgba(0,0,0,.52);
      pointer-events: none;
    }

    #shadeTop {
      top: 0;
      height: calc(50% - 48px);
    }

    #shadeBottom {
      bottom: 0;
      height: calc(50% - 48px);
    }

    /* VIN target area */
    #scanBox {
      position: absolute;
      width: 94%;
      height: 96px;
      left: 3%;
      top: 50%;
      transform: translateY(-50%);
      border: 3px solid #25e86f;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.4),
        0 0 20px rgba(37,232,111,.25);
      pointer-events: none;
      transition: .2s ease;
    }

    #scanBox.found {
      border-color: #25e86f;
      box-shadow: 0 0 28px rgba(37,232,111,.85);
    }

    #scanBox.processing {
      border-color: #ffd54a;
    }

    #topBar {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      padding: 12px 20px;
      text-align: center;
      color: white;
      z-index: 5;
      text-shadow: 0 2px 5px rgba(0,0,0,.8);
    }

    #title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    #instruction {
      margin-top: 7px;
      font-size: 14px;
      opacity: .9;
    }

    #status {
      position: absolute;
      width: 90%;
      left: 5%;
      bottom: max(38px, calc(env(safe-area-inset-bottom) + 25px));
      color: white;
      text-align: center;
      z-index: 5;
    }

    #statusText {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(0,0,0,.72);
      font-size: 15px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    #resultCard {
      display: none;
      position: absolute;
      left: 5%;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 15px));
      width: 90%;
      background: rgba(255,255,255,.97);
      color: #111;
      border-radius: 18px;
      padding: 20px;
      z-index: 20;
      box-shadow: 0 10px 40px rgba(0,0,0,.45);
    }

    #successLabel {
      color: #138a43;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    #vinResult {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1px;
      word-break: break-all;
    }

    #vehicleResult {
      margin-top: 8px;
      font-size: 17px;
      color: #444;
      font-weight: 600;
    }

    #continueBtn {
      width: 100%;
      margin-top: 17px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    #manualBtn {
      margin-top: 12px;
      background: transparent;
      color: white;
      border: 0;
      text-decoration: underline;
      font-size: 14px;
      cursor: pointer;
    }

    #manualPanel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,.93);
      padding: 30px 20px;
      align-items: center;
      justify-content: center;
    }

    #manualCard {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 18px;
      padding: 22px;
    }

    #manualCard h2 {
      margin-top: 0;
    }

    #manualVin {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      text-transform: uppercase;
      border: 2px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    #manualSubmit {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
      font-size: 16px;
    }

    #manualCancel {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      background: transparent;
      border: 0;
      font-size: 15px;
    }

    #cameraError {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      background: #111;
      color: white;
      padding: 35px;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<div id="app">

  <video id="video" autoplay playsinline muted></video>

  <div id="shadeTop" class="shade"></div>
  <div id="shadeBottom" class="shade"></div>

  <div id="scanBox"></div>

  <div id="topBar">
    <div id="title">VIN SCANNER</div>
    <div id="instruction">
      Place one complete VIN inside the green box
    </div>
  </div>

  <div id="status">
    <div id="statusText">Starting camera...</div>
    <br>
    <button id="manualBtn">Enter VIN manually</button>
  </div>

  <div id="resultCard">
    <div id="successLabel">VEHICLE FOUND</div>
    <div id="vinResult"></div>
    <div id="vehicleResult"></div>
    <button id="continueBtn">CONTINUE</button>
  </div>

  <div id="manualPanel">
    <div id="manualCard">
      <h2>Enter VIN</h2>

      <input
        id="manualVin"
        maxlength="17"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="17-character VIN"
      >

      <button id="manualSubmit">CHECK VIN</button>
      <button id="manualCancel">Cancel</button>
    </div>
  </div>

  <div id="cameraError">
    <h2>Camera unavailable</h2>
    <p id="cameraErrorText"></p>
  </div>

  <canvas id="captureCanvas"></canvas>

</div>


<script>
/* =========================================================
   A-TO-Z YARD VIN SCANNER
   Gemini backend version
   ========================================================= */


/* ===================== CONFIG ===================== */

/*
  PASTE YOUR APPS SCRIPT WEB APP /exec URL BELOW.

  Example format:
  https://script.google.com/macros/s/XXXXXXXXXXXX/exec
*/

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxeFrEttl7fh8lmSzBJGO852xYTTsV5BrjHssoj2IK4biAhJLApLMs1qUIbbAlsbHWXsw/exec";


const APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";

const FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";


/*
  Scanner timing.

  We deliberately do NOT hammer Gemini continuously.

  One request runs at a time.
  After it finishes, scanner waits this long before
  taking another fresh VIN snapshot.
*/

const SCAN_DELAY = 900;


/*
  JPEG quality sent to Gemini.
  0.86 gives good text quality without giant uploads.
*/

const JPEG_QUALITY = 0.86;


/* ===================== ELEMENTS ===================== */

const video = document.getElementById("video");

const canvas =
  document.getElementById("captureCanvas");

const ctx =
  canvas.getContext("2d");

const scanBox =
  document.getElementById("scanBox");

const statusText =
  document.getElementById("statusText");

const statusArea =
  document.getElementById("status");

const resultCard =
  document.getElementById("resultCard");

const vinResult =
  document.getElementById("vinResult");

const vehicleResult =
  document.getElementById("vehicleResult");

const continueBtn =
  document.getElementById("continueBtn");

const manualBtn =
  document.getElementById("manualBtn");

const manualPanel =
  document.getElementById("manualPanel");

const manualVin =
  document.getElementById("manualVin");

const manualSubmit =
  document.getElementById("manualSubmit");

const manualCancel =
  document.getElementById("manualCancel");

const cameraError =
  document.getElementById("cameraError");

const cameraErrorText =
  document.getElementById("cameraErrorText");


/* ===================== STATE ===================== */

let stream = null;

let scanning = false;

let requestRunning = false;

let vehicleFound = false;

let detectedVehicle = null;

let scanTimer = null;


/* ===================== CAMERA ===================== */

async function startCamera() {

  try {

    if (
      !BACKEND_URL ||
      BACKEND_URL.includes("PASTE_YOUR")
    ) {
      throw new Error(
        "Apps Script backend URL has not been configured."
      );
    }


    statusText.textContent =
      "Starting camera...";


    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    stream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );


    video.srcObject = stream;


    await new Promise(resolve => {

      video.onloadedmetadata = () => {
        resolve();
      };

    });


    await video.play();


    /*
      Ask supported phones for continuous focus.

      Browsers simply ignore this if unsupported.
    */

    try {

      const track =
        stream.getVideoTracks()[0];

      const capabilities =
        track.getCapabilities
          ? track.getCapabilities()
          : {};


      const advanced = {};


      if (
        capabilities.focusMode &&
        capabilities.focusMode.includes("continuous")
      ) {
        advanced.focusMode = "continuous";
      }


      if (
        capabilities.exposureMode &&
        capabilities.exposureMode.includes("continuous")
      ) {
        advanced.exposureMode = "continuous";
      }


      if (
        capabilities.whiteBalanceMode &&
        capabilities.whiteBalanceMode.includes("continuous")
      ) {
        advanced.whiteBalanceMode =
          "continuous";
      }


      if (
        Object.keys(advanced).length
      ) {

        await track.applyConstraints({
          advanced: [advanced]
        });

      }

    }
    catch (e) {

      console.log(
        "Advanced camera controls unavailable:",
        e
      );

    }


    scanning = true;

    statusText.textContent =
      "Point at VIN";

    scheduleNextScan(700);

  }
  catch (error) {

    console.error(error);

    cameraError.style.display = "flex";

    cameraErrorText.textContent =
      error.message ||
      "Please allow camera access and reload.";

  }

}


/* ===================== CAPTURE ===================== */

function captureVinStrip() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return null;
  }


  /*
    The visible video uses object-fit: cover.

    Therefore we calculate the relationship between
    the actual camera frame and what is displayed
    on the phone.
  */

  const videoRect =
    video.getBoundingClientRect();

  const boxRect =
    scanBox.getBoundingClientRect();


  const sourceWidth =
    video.videoWidth;

  const sourceHeight =
    video.videoHeight;


  const displayedWidth =
    videoRect.width;

  const displayedHeight =
    videoRect.height;


  const scale =
    Math.max(
      displayedWidth / sourceWidth,
      displayedHeight / sourceHeight
    );


  const renderedWidth =
    sourceWidth * scale;

  const renderedHeight =
    sourceHeight * scale;


  const cropOffsetX =
    (renderedWidth - displayedWidth) / 2;

  const cropOffsetY =
    (renderedHeight - displayedHeight) / 2;


  /*
    Position of green box relative to video element.
  */

  const visibleX =
    boxRect.left - videoRect.left;

  const visibleY =
    boxRect.top - videoRect.top;


  let sourceX =
    (visibleX + cropOffsetX) / scale;

  let sourceY =
    (visibleY + cropOffsetY) / scale;

  let sourceCropWidth =
    boxRect.width / scale;

  let sourceCropHeight =
    boxRect.height / scale;


  /*
    Small internal margin so the green border itself
    isn't included in the image sent to Gemini.
  */

  const horizontalMargin =
    sourceCropWidth * 0.015;

  const verticalMargin =
    sourceCropHeight * 0.08;


  sourceX += horizontalMargin;

  sourceY += verticalMargin;

  sourceCropWidth -=
    horizontalMargin * 2;

  sourceCropHeight -=
    verticalMargin * 2;


  /*
    Safety boundaries.
  */

  sourceX =
    Math.max(0, sourceX);

  sourceY =
    Math.max(0, sourceY);


  sourceCropWidth =
    Math.min(
      sourceCropWidth,
      sourceWidth - sourceX
    );

  sourceCropHeight =
    Math.min(
      sourceCropHeight,
      sourceHeight - sourceY
    );


  /*
    Upscale the thin VIN strip before sending it.

    This helps preserve small printed characters.
  */

  const targetWidth = 1600;

  const ratio =
    targetWidth / sourceCropWidth;

  const targetHeight =
    Math.max(
      180,
      Math.round(
        sourceCropHeight * ratio
      )
    );


  canvas.width =
    targetWidth;

  canvas.height =
    targetHeight;


  ctx.imageSmoothingEnabled = true;

  ctx.imageSmoothingQuality = "high";


  ctx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceCropWidth,
    sourceCropHeight,

    0,
    0,
    targetWidth,
    targetHeight
  );


  /*
    JPEG Base64 image.
  */

  return canvas.toDataURL(
    "image/jpeg",
    JPEG_QUALITY
  );

}


/* ===================== SCANNER LOOP ===================== */

function scheduleNextScan(delay = SCAN_DELAY) {

  clearTimeout(scanTimer);


  if (
    !scanning ||
    vehicleFound
  ) {
    return;
  }


  scanTimer =
    setTimeout(
      scanFrame,
      delay
    );

}


async function scanFrame() {

  if (
    !scanning ||
    vehicleFound ||
    requestRunning
  ) {
    return;
  }


  const image =
    captureVinStrip();


  if (!image) {

    scheduleNextScan(500);

    return;

  }


  requestRunning = true;

  scanBox.classList.add(
    "processing"
  );

  statusText.textContent =
    "Reading VIN...";


  try {

    const result =
      await sendToBackend(image);


    if (
      result &&
      result.success === true &&
      result.found === true &&
      isValidVin(result.vin)
    ) {

      lockVehicle(result);

      return;

    }


    /*
      Nothing reliable found.
      Keep camera alive and try another fresh frame.
    */

    statusText.textContent =
      "Point at VIN";

  }
  catch (error) {

    console.error(
      "VIN request failed:",
      error
    );


    /*
      A temporary network/API problem should NOT
      kill the scanner.
    */

    statusText.textContent =
      "Trying again...";

  }
  finally {

    requestRunning = false;

    scanBox.classList.remove(
      "processing"
    );


    if (!vehicleFound) {

      scheduleNextScan();

    }

  }

}


/* ===================== BACKEND ===================== */

async function sendToBackend(imageData) {

  /*
    IMPORTANT:

    Apps Script Web Apps may redirect the POST
    request to Google's content host.

    fetch follows redirects automatically.
  */

  const response =
    await fetch(
      BACKEND_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "scanVin",

          image: imageData

        }),

        redirect: "follow"

      }
    );


  if (!response.ok) {

    throw new Error(
      "Backend HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  try {

    return JSON.parse(text);

  }
  catch (error) {

    console.error(
      "Backend returned:",
      text
    );

    throw new Error(
      "Invalid backend response."
    );

  }

}


/* ===================== VIN VALIDATION ===================== */

function isValidVin(vin) {

  if (!vin) {
    return false;
  }


  vin =
    String(vin)
      .trim()
      .toUpperCase();


  return /^[A-HJ-NPR-Z0-9]{17}$/
    .test(vin);

}


/* ===================== SUCCESS ===================== */

function lockVehicle(vehicle) {

  vehicleFound = true;

  scanning = false;

  detectedVehicle = vehicle;


  clearTimeout(scanTimer);


  scanBox.classList.remove(
    "processing"
  );

  scanBox.classList.add(
    "found"
  );


  statusArea.style.display =
    "none";


  vinResult.textContent =
    vehicle.vin;


  const description = [
    vehicle.year,
    vehicle.make,
    vehicle.model
  ]
  .filter(Boolean)
  .join(" ");


  vehicleResult.textContent =
    description ||
    "Vehicle decoded";


  resultCard.style.display =
    "block";


  /*
    Small success vibration on supported phones.
  */

  try {

    if (navigator.vibrate) {
      navigator.vibrate(120);
    }

  }
  catch (_) {}


  console.log(
    "VIN LOCKED:",
    vehicle
  );

}


/* ===================== APPSHEET ===================== */

function openAppSheet() {

  if (!detectedVehicle) {
    return;
  }


  const defaults = {

    "VIN":
      detectedVehicle.vin,

    "Year":
      detectedVehicle.year || "",

    "Make":
      detectedVehicle.make || "",

    "Model":
      detectedVehicle.model || ""

  };


  const appUrl =
    "https://www.appsheet.com/start/" +
    APP_ID +
    "#control=" +
    encodeURIComponent(FORM_VIEW) +
    "&defaults=" +
    encodeURIComponent(
      JSON.stringify(defaults)
    ) +
    "&page=form";


  window.location.href =
    appUrl;

}


continueBtn.addEventListener(
  "click",
  openAppSheet
);


/* ===================== MANUAL VIN ===================== */

manualBtn.addEventListener(
  "click",
  () => {

    manualPanel.style.display =
      "flex";

    manualVin.value = "";

    setTimeout(
      () => manualVin.focus(),
      100
    );

  }
);


manualCancel.addEventListener(
  "click",
  () => {

    manualPanel.style.display =
      "none";

  }
);


manualVin.addEventListener(
  "input",
  () => {

    manualVin.value =
      manualVin.value
        .toUpperCase()
        .replace(
          /[^A-HJ-NPR-Z0-9]/g,
          ""
        )
        .slice(0,17);

  }
);


manualSubmit.addEventListener(
  "click",
  checkManualVin
);


manualVin.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      checkManualVin();
    }

  }
);


async function checkManualVin() {

  const vin =
    manualVin.value
      .trim()
      .toUpperCase();


  if (!isValidVin(vin)) {

    alert(
      "VIN must contain exactly 17 valid characters."
    );

    return;

  }


  /*
    Manual fallback uses NHTSA directly.

    No image OCR is needed.
  */

  manualSubmit.disabled = true;

  manualSubmit.textContent =
    "CHECKING...";


  try {

    const url =
      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/" +
      encodeURIComponent(vin) +
      "?format=json";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "VIN lookup failed."
      );

    }


    const data =
      await response.json();


    const vehicle =
      data.Results &&
      data.Results[0];


    if (
      !vehicle ||
      !vehicle.ModelYear ||
      !vehicle.Make
    ) {

      alert(
        "VIN could not be verified."
      );

      return;

    }


    manualPanel.style.display =
      "none";


    lockVehicle({

      success: true,

      found: true,

      vin: vin,

      year:
        vehicle.ModelYear || "",

      make:
        vehicle.Make || "",

      model:
        vehicle.Model || ""

    });

  }
  catch (error) {

    console.error(error);

    alert(
      "Could not check VIN. Please try again."
    );

  }
  finally {

    manualSubmit.disabled =
      false;

    manualSubmit.textContent =
      "CHECK VIN";

  }

}


/* ===================== PAGE START ===================== */

window.addEventListener(
  "load",
  startCamera
);


/* Stop camera cleanly if page closes */

window.addEventListener(
  "pagehide",
  () => {

    scanning = false;

    clearTimeout(scanTimer);


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

  }
);

</script>

</body>
</html>
