<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>A-to-Z VIN Scanner V6</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #080a0c;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding: 12px;
  text-align: center;
}

h1 {
  font-size: 22px;
  margin: 3px 0;
}

.version {
  color: #8d949c;
  font-size: 13px;
  margin-bottom: 10px;
}

#camera {
  position: relative;
  width: 100%;
  max-width: 720px;
  margin: auto;
  overflow: hidden;
  background: black;
  border-radius: 14px;
}

video {
  display: block;
  width: 100%;
  height: auto;
}

/* Dark areas outside scanning strip */
.mask {
  position: absolute;
  left: 0;
  right: 0;
  background: rgba(0,0,0,.48);
  pointer-events: none;
}

#maskTop {
  top: 0;
  height: 43%;
}

#maskBottom {
  bottom: 0;
  height: 45%;
}

/*
   THIN VIN BOX
*/
#vinBox {
  position: absolute;

  left: 2.5%;
  right: 2.5%;

  top: 43%;
  height: 12%;

  min-height: 48px;

  border: 3px solid #00ef83;
  border-radius: 7px;

  box-shadow:
    0 0 8px rgba(0,239,131,.7),
    inset 0 0 8px rgba(0,239,131,.18);

  pointer-events: none;

  transition:
    border-color .15s,
    box-shadow .15s;
}

#vinBox.found {
  border-color: #00ff72;

  box-shadow:
    0 0 22px rgba(0,255,114,1),
    inset 0 0 18px rgba(0,255,114,.25);
}

#label {
  position: absolute;

  top: calc(43% - 27px);

  left: 0;
  right: 0;

  font-size: 12px;
  font-weight: bold;

  color: #00ef83;

  text-shadow: 0 1px 4px #000;

  pointer-events: none;
}

#scanLine {
  position: absolute;

  left: 3.5%;
  right: 3.5%;

  top: 44%;

  height: 2px;

  background: #00ff88;

  box-shadow: 0 0 10px #00ff88;

  animation: moveLine .65s ease-in-out infinite alternate;

  pointer-events: none;
}

@keyframes moveLine {
  from { transform: translateY(1px); }
  to   { transform: translateY(40px); }
}

#status {
  margin: 13px auto 3px;
  max-width: 720px;

  font-size: 17px;
  font-weight: bold;
}

#hint {
  margin: 4px auto 10px;
  max-width: 720px;

  color: #9299a1;
  font-size: 13px;
  min-height: 18px;
}

#result {
  display: none;

  max-width: 720px;

  margin: 12px auto;
  padding: 17px;

  background: #15191d;

  border: 1px solid #2c343b;
  border-radius: 12px;
}

#verified {
  color: #00ef83;
  font-weight: bold;
  font-size: 13px;
}

#vin {
  margin-top: 8px;

  font-size: 23px;
  font-weight: bold;

  letter-spacing: 1.4px;

  word-break: break-all;
}

#vehicle {
  margin-top: 9px;

  color: #00ef83;

  font-size: 19px;
  font-weight: bold;
}

button {
  display: block;

  width: 100%;
  max-width: 720px;

  margin: 9px auto 0;

  padding: 15px;

  border: 0;
  border-radius: 10px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
}

#continue {
  display: none;

  background: #00a961;
  color: white;
}

#again {
  display: none;

  background: #292e33;
  color: white;
}

#manual {
  background: transparent;
  color: #aaa;

  border: 1px solid #353b41;
}

#manualArea {
  display: none;

  max-width: 720px;

  margin: 10px auto;
  padding: 12px;

  background: #15191d;

  border-radius: 10px;
}

#manualVIN {
  width: 100%;

  padding: 14px;

  border-radius: 8px;
  border: 1px solid #4a5158;

  background: #090b0d;
  color: white;

  text-align: center;

  font-size: 18px;
  font-weight: bold;

  letter-spacing: 1.2px;

  text-transform: uppercase;
}

#checkManual {
  background: #1478ff;
  color: white;
}

canvas {
  display: none;
}
</style>
</head>

<body>

<h1>A-to-Z Yard</h1>
<div class="version">VIN Scanner V6</div>

<div id="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="maskTop" class="mask"></div>
  <div id="maskBottom" class="mask"></div>

  <div id="label">
    PLACE VIN INSIDE BOX
  </div>

  <div id="vinBox"></div>
  <div id="scanLine"></div>

</div>

<div id="status">Starting camera...</div>

<div id="hint">
  Keep one VIN line inside the green box.
</div>

<div id="result">

  <div id="verified">
    ✓ VIN VERIFIED
  </div>

  <div id="vin"></div>

  <div id="vehicle"></div>

</div>

<button id="continue">
  CONTINUE
</button>

<button id="again">
  SCAN ANOTHER VIN
</button>

<button id="manual">
  ENTER VIN MANUALLY
</button>

<div id="manualArea">

  <input
    id="manualVIN"
    maxlength="17"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="17 CHARACTER VIN">

  <button id="checkManual">
    VERIFY VIN
  </button>

</div>

<canvas id="snapshot"></canvas>

<script>

/* =========================================
   APPSHEET
========================================= */

const APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";

const FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";


/* =========================================
   DOM
========================================= */

const video =
  document.getElementById("video");

const snapshot =
  document.getElementById("snapshot");

const vinBox =
  document.getElementById("vinBox");

const scanLine =
  document.getElementById("scanLine");

const statusEl =
  document.getElementById("status");

const hintEl =
  document.getElementById("hint");

const resultEl =
  document.getElementById("result");

const vinEl =
  document.getElementById("vin");

const vehicleEl =
  document.getElementById("vehicle");

const continueBtn =
  document.getElementById("continue");

const againBtn =
  document.getElementById("again");

const manualBtn =
  document.getElementById("manual");

const manualArea =
  document.getElementById("manualArea");

const manualVIN =
  document.getElementById("manualVIN");

const checkManual =
  document.getElementById("checkManual");


/* =========================================
   STATE
========================================= */

let stream = null;
let worker = null;

let running = false;

let finalVIN = "";
let finalYear = "";
let finalMake = "";
let finalModel = "";

let snapshotCount = 0;

/*
  Prevent repeated NHTSA calls for the
  same bad OCR candidate.
*/
const rejected =
  new Set();


/* =========================================
   START
========================================= */

window.addEventListener(
  "load",
  init
);


async function init() {

  try {

    statusEl.textContent =
      "Opening camera...";


    await openCamera();


    statusEl.textContent =
      "Preparing VIN reader...";


    await createOCRWorker();


    statusEl.textContent =
      "Scanning VIN...";


    hintEl.textContent =
      "Move the phone until all 17 characters are clear.";


    running = true;


    /*
      Start the automatic snapshot engine.
    */
    snapshotEngine();

  }

  catch (error) {

    console.error(error);


    statusEl.textContent =
      "Scanner couldn't start.";


    hintEl.textContent =
      error.message;


    manualArea.style.display =
      "block";

  }

}


/* =========================================
   CAMERA
========================================= */

async function openCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      "Camera access is not available."
    );

  }


  stream =
    await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    });


  video.srcObject =
    stream;


  await video.play();


  await waitForCamera();


  await improveCamera();

}


/* =========================================
   WAIT FOR CAMERA DIMENSIONS
========================================= */

function waitForCamera() {

  return new Promise(
    function(resolve, reject) {

      let tries = 0;


      const timer =
        setInterval(
          function() {

            tries++;


            if (
              video.videoWidth > 0 &&
              video.videoHeight > 0
            ) {

              clearInterval(timer);

              resolve();

              return;

            }


            if (
              tries > 80
            ) {

              clearInterval(timer);


              reject(
                new Error(
                  "Camera failed to initialize."
                )
              );

            }

          },

          100
        );

    }
  );

}


/* =========================================
   AUTOFOCUS / CAMERA QUALITY
========================================= */

async function improveCamera() {

  try {

    const track =
      stream.getVideoTracks()[0];


    if (!track) {
      return;
    }


    const caps =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    const advanced =
      [];


    if (
      caps.focusMode &&
      caps.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        focusMode: "continuous"
      });

    }


    if (
      caps.exposureMode &&
      caps.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        exposureMode: "continuous"
      });

    }


    if (
      caps.whiteBalanceMode &&
      caps.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        whiteBalanceMode: "continuous"
      });

    }


    if (
      advanced.length
    ) {

      await track.applyConstraints({
        advanced
      });

    }

  }

  catch (error) {

    console.log(
      "Advanced camera controls unavailable.",
      error
    );

  }

}


/* =========================================
   TESSERACT
========================================= */

async function createOCRWorker() {

  worker =
    await Tesseract.createWorker(
      "eng"
    );


  await worker.setParameters({

    /*
      VINs don't contain I, O or Q.
    */

    tessedit_char_whitelist:
      "ABCDEFGHJKLMNPRSTUVWXYZ0123456789",

    /*
      Treat screenshot as ONE line.
    */

    tessedit_pageseg_mode:
      "7",

    preserve_interword_spaces:
      "0"

  });

}


/* =========================================
   AUTOMATIC SNAPSHOT ENGINE
========================================= */

async function snapshotEngine() {

  /*
    IMPORTANT:

    There is intentionally NO:
      MAX_PASSES
      MAX_ROUNDS
      timeout

    It keeps taking fresh snapshots.
  */

  while (running) {

    snapshotCount++;


    /*
      Take a NEW frozen screenshot from
      the current camera image.
    */

    const frame =
      captureThinStrip();


    /*
      Alternate processing modes instead
      of wasting time processing many
      versions of an old frame.
    */

    let mode;


    const phase =
      snapshotCount % 4;


    if (phase === 0) {

      mode =
        "normal";

    }

    else if (phase === 1) {

      mode =
        "contrast";

    }

    else if (phase === 2) {

      mode =
        "threshold";

    }

    else {

      mode =
        "softThreshold";

    }


    const processed =
      processSnapshot(
        frame,
        mode
      );


    let recognition;


    try {

      recognition =
        await worker.recognize(
          processed
        );

    }

    catch (error) {

      console.log(
        "OCR error:",
        error
      );


      await sleep(80);

      continue;

    }


    if (!running) {
      return;
    }


    const text =
      String(
        recognition.data.text || ""
      )
      .toUpperCase();


    console.log(
      "Snapshot",
      snapshotCount,
      mode,
      text
    );


    const candidates =
      getVINCandidates(
        text
      );


    /*
      If we see a plausible VIN,
      verify immediately.
    */

    for (
      const candidate of candidates
    ) {

      if (!running) {
        return;
      }


      if (
        rejected.has(
          candidate
        )
      ) {

        continue;

      }


      statusEl.textContent =
        "Checking VIN...";


      const vehicle =
        await verifyVIN(
          candidate
        );


      if (
        vehicle
      ) {

        showSuccess(
          candidate,
          vehicle
        );


        return;

      }


      /*
        Bad candidate.
        Forget screenshot and continue
        with a FRESH camera image.
      */

      rejected.add(
        candidate
      );


      statusEl.textContent =
        "Scanning VIN...";

    }


    /*
      Don't display attempt numbers.

      Worker only needs useful guidance.
    */

    if (
      snapshotCount > 6 &&
      snapshotCount <= 15
    ) {

      hintEl.textContent =
        "Hold steady and move slightly closer.";

    }

    else if (
      snapshotCount > 15
    ) {

      hintEl.textContent =
        "Keep only the VIN line inside the box and avoid glare.";

    }


    /*
      Small pause so UI/camera remains smooth.
    */

    await sleep(
      90
    );

  }

}


/* =========================================
   CAPTURE ONLY THE THIN GREEN STRIP
========================================= */

function captureThinStrip() {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;


  /*
    This corresponds closely to the
    thin green rectangle.

    The vertical crop is intentionally
    SMALL so text below the VIN should
    stay outside OCR.
  */

  const sx =
    Math.floor(
      vw * 0.025
    );


  const sy =
    Math.floor(
      vh * 0.435
    );


  const sw =
    Math.floor(
      vw * 0.95
    );


  const sh =
    Math.floor(
      vh * 0.09
    );


  /*
    Enlarge the VIN strip before OCR.
  */

  const scale =
    3;


  snapshot.width =
    Math.floor(
      sw * scale
    );


  snapshot.height =
    Math.floor(
      sh * scale
    );


  const ctx =
    snapshot.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.clearRect(
    0,
    0,
    snapshot.width,
    snapshot.height
  );


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    video,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    snapshot.width,
    snapshot.height

  );


  return snapshot;

}


/* =========================================
   PROCESS ONE SNAPSHOT
========================================= */

function processSnapshot(
  source,
  mode
) {

  const out =
    document.createElement(
      "canvas"
    );


  out.width =
    source.width;


  out.height =
    source.height;


  const ctx =
    out.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.drawImage(
    source,
    0,
    0
  );


  if (
    mode === "normal"
  ) {

    return out;

  }


  const img =
    ctx.getImageData(
      0,
      0,
      out.width,
      out.height
    );


  const data =
    img.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];


    let value =
      gray;


    if (
      mode === "contrast"
    ) {

      /*
        Strong contrast while preserving
        anti-aliased character edges.
      */

      value =
        (gray - 128) *
        2.15 +
        128;

    }


    else if (
      mode === "threshold"
    ) {

      value =
        gray > 145
          ? 255
          : 0;

    }


    else if (
      mode === "softThreshold"
    ) {

      /*
        Slightly lighter threshold helps
        faded / gray printed VINs.
      */

      value =
        gray > 125
          ? 255
          : 0;

    }


    value =
      Math.max(
        0,
        Math.min(
          255,
          value
        )
      );


    data[i] =
      value;


    data[i + 1] =
      value;


    data[i + 2] =
      value;

  }


  ctx.putImageData(
    img,
    0,
    0
  );


  return out;

}


/* =========================================
   OCR TEXT → VIN
========================================= */

function getVINCandidates(
  text
) {

  const found =
    new Set();


  /*
    Never merge multiple OCR lines.
  */

  const lines =
    String(text)
      .toUpperCase()
      .split(/\r?\n/);


  for (
    let line of lines
  ) {

    if (
      !line.trim()
    ) {

      continue;

    }


    /*
      Remove spaces / punctuation.
    */

    line =
      line.replace(
        /[^A-Z0-9]/g,
        ""
      );


    /*
      OCR sometimes produces forbidden
      VIN letters.

      Convert the obvious ones.
    */

    line =
      line
        .replace(/I/g, "1")
        .replace(/O/g, "0")
        .replace(/Q/g, "0");


    /*
      Perfect OCR result.
    */

    if (
      line.length === 17
    ) {

      if (
        basicVINCheck(
          line
        )
      ) {

        found.add(
          line
        );

      }

      continue;

    }


    /*
      Only tolerate a tiny amount of OCR
      garbage around a VIN.

      Do NOT search massive text strings.
    */

    if (
      line.length >= 18 &&
      line.length <= 20
    ) {

      const maxStart =
        line.length - 17;


      for (
        let start = 0;
        start <= maxStart;
        start++
      ) {

        const candidate =
          line.substring(
            start,
            start + 17
          );


        if (
          basicVINCheck(
            candidate
          )
        ) {

          found.add(
            candidate
          );

        }

      }

    }

  }


  return [
    ...found
  ];

}


/* =========================================
   BASIC VIN CHECK
========================================= */

function basicVINCheck(
  vin
) {

  if (
    vin.length !== 17
  ) {

    return false;

  }


  /*
    VIN alphabet:
    no I, O, Q
  */

  if (
    !/^[A-HJ-NPR-Z0-9]{17}$/.test(
      vin
    )
  ) {

    return false;

  }


  /*
    Prevent obvious OCR garbage.
  */

  const unique =
    new Set(
      vin.split("")
    );


  if (
    unique.size < 6
  ) {

    return false;

  }


  /*
    Position 10 is model year.
  */

  const yearCode =
    vin[9];


  if (
    !/^[A-HJ-NPR-TV-Y1-9]$/.test(
      yearCode
    )
  ) {

    return false;

  }


  return true;

}


/* =========================================
   NHTSA VIN VERIFICATION
========================================= */

async function verifyVIN(
  vin
) {

  try {

    const url =
      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/" +
      encodeURIComponent(vin) +
      "?format=json";


    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      return null;

    }


    const data =
      await response.json();


    if (
      !data.Results ||
      !data.Results.length
    ) {

      return null;

    }


    const v =
      data.Results[0];


    const year =
      String(
        v.ModelYear || ""
      ).trim();


    const make =
      String(
        v.Make || ""
      ).trim();


    const model =
      String(
        v.Model || ""
      ).trim();


    /*
      Never accept random 17 characters
      just because API responded.
    */

    if (
      !year ||
      !make
    ) {

      return null;

    }


    return {
      year,
      make,
      model
    };

  }

  catch (error) {

    console.log(
      "VIN API error:",
      error
    );


    return null;

  }

}


/* =========================================
   SUCCESS
========================================= */

function showSuccess(
  vin,
  vehicle
) {

  /*
    STOP snapshot/OCR loop immediately.
  */

  running =
    false;


  finalVIN =
    vin;


  finalYear =
    vehicle.year;


  finalMake =
    vehicle.make;


  finalModel =
    vehicle.model;


  vinBox.classList.add(
    "found"
  );


  scanLine.style.display =
    "none";


  statusEl.textContent =
    "VIN FOUND";


  hintEl.textContent =
    "Vehicle verified.";


  vinEl.textContent =
    finalVIN;


  vehicleEl.textContent =
    [
      finalYear,
      finalMake,
      finalModel
    ]
    .filter(Boolean)
    .join(" ");


  resultEl.style.display =
    "block";


  continueBtn.style.display =
    "block";


  againBtn.style.display =
    "block";


  manualBtn.style.display =
    "none";


  manualArea.style.display =
    "none";


  /*
    Small vibration = worker knows it
    locked without staring at status text.
  */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      80
    );

  }

}


/* =========================================
   SCAN AGAIN
========================================= */

againBtn.addEventListener(
  "click",
  function() {

    running =
      false;


    setTimeout(
      function() {

        finalVIN = "";
        finalYear = "";
        finalMake = "";
        finalModel = "";

        snapshotCount =
          0;

        rejected.clear();


        vinBox.classList.remove(
          "found"
        );


        resultEl.style.display =
          "none";


        continueBtn.style.display =
          "none";


        againBtn.style.display =
          "none";


        manualBtn.style.display =
          "block";


        scanLine.style.display =
          "block";


        statusEl.textContent =
          "Scanning VIN...";


        hintEl.textContent =
          "Keep all 17 characters inside the green box.";


        running =
          true;


        snapshotEngine();

      },

      150
    );

  }
);


/* =========================================
   MANUAL ENTRY
========================================= */

manualBtn.addEventListener(
  "click",
  function() {

    /*
      Pause automatic scanner while typing.
    */

    running =
      false;


    scanLine.style.display =
      "none";


    manualArea.style.display =
      "block";


    statusEl.textContent =
      "Manual VIN entry";


    hintEl.textContent =
      "Enter all 17 characters.";


    manualVIN.focus();

  }
);


manualVIN.addEventListener(
  "input",
  function() {

    this.value =
      this.value
        .toUpperCase()
        .replace(
          /[^A-HJ-NPR-Z0-9]/g,
          ""
        )
        .slice(
          0,
          17
        );

  }
);


checkManual.addEventListener(
  "click",
  async function() {

    const vin =
      manualVIN.value
        .trim()
        .toUpperCase();


    if (
      !basicVINCheck(
        vin
      )
    ) {

      statusEl.textContent =
        "VIN must contain 17 valid characters.";

      return;

    }


    statusEl.textContent =
      "Checking VIN...";


    const vehicle =
      await verifyVIN(
        vin
      );


    if (
      !vehicle
    ) {

      statusEl.textContent =
        "VIN could not be verified.";

      return;

    }


    showSuccess(
      vin,
      vehicle
    );

  }
);


/* =========================================
   CONTINUE → APPSHEET
========================================= */

continueBtn.addEventListener(
  "click",
  function() {

    if (
      !finalVIN
    ) {

      return;

    }


    statusEl.textContent =
      "Opening vehicle form...";


    const defaults = {

      VIN:
        finalVIN,

      Year:
        finalYear,

      Make:
        finalMake,

      Model:
        finalModel

    };


    const url =

      "https://www.appsheet.com/start/" +

      APP_ID +

      "#control=" +

      encodeURIComponent(
        FORM_VIEW
      ) +

      "&defaults=" +

      encodeURIComponent(
        JSON.stringify(
          defaults
        )
      ) +

      "&page=form";


    window.location.href =
      url;

  }
);


/* =========================================
   HELPER
========================================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

</script>
