<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>A-to-Z VIN Scanner</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: Arial, sans-serif;

    }


    #camera {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;

    }


    #overlay {

      position: fixed;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      pointer-events: none;

    }


    #header {

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      padding:
        calc(18px + env(safe-area-inset-top))
        15px
        18px;

      text-align: center;

      color: white;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.80),
          rgba(0,0,0,0)
        );

    }


    #title {

      font-size: 21px;

      font-weight: 700;

    }


    #subtitle {

      margin-top: 6px;

      font-size: 14px;

      opacity: 0.85;

    }


    #scanArea {

      position: absolute;

      left: 4%;

      top: 50%;

      transform: translateY(-50%);

      width: 92%;

      height: 90px;

      border: 3px solid #00ff66;

      border-radius: 12px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.32),
        0 0 20px rgba(0,255,102,0.35);

    }


    #scanArea::before {

      content: "";

      position: absolute;

      left: 4%;
      right: 4%;

      top: 50%;

      height: 2px;

      transform: translateY(-50%);

      background: #00ff66;

      box-shadow: 0 0 10px #00ff66;

    }


    #bottomPanel {

      position: absolute;

      left: 12px;
      right: 12px;

      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      padding: 18px;

      border-radius: 16px;

      background: rgba(0,0,0,0.78);

      color: white;

      text-align: center;

      pointer-events: auto;

    }


    #status {

      font-size: 17px;

      font-weight: 700;

    }


    #result {

      margin-top: 10px;

      min-height: 30px;

      font-size: 22px;

      font-weight: 800;

      letter-spacing: 1px;

      color: #00ff66;

      word-break: break-all;

    }


    #details {

      margin-top: 7px;

      font-size: 12px;

      opacity: 0.75;

      word-break: break-word;

      max-height: 100px;

      overflow: hidden;

    }


    #restartButton {

      display: none;

      width: 100%;

      margin-top: 15px;

      padding: 14px;

      border: 0;

      border-radius: 10px;

      font-size: 16px;

      font-weight: 700;

      background: white;

      color: black;

      cursor: pointer;

    }


    #addInventoryButton {

      display: none;

      width: 100%;

      margin-top: 10px;

      padding: 14px;

      border: 0;

      border-radius: 10px;

      font-size: 16px;

      font-weight: 700;

      background: #00ff66;

      color: #000;

      cursor: pointer;

    }


    #captureCanvas {

      display: none;

    }

  </style>

</head>



<body>


  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>


  <canvas
    id="captureCanvas"
  ></canvas>


  <div id="overlay">


    <div id="header">

      <div id="title">
        A-to-Z VIN Scanner
      </div>

      <div id="subtitle">
        Place the full 17-character VIN inside the green box
      </div>

    </div>


    <div id="scanArea"></div>


    <div id="bottomPanel">

      <div id="status">
        Starting camera...
      </div>

      <div id="result"></div>

      <div id="details"></div>


      <button id="restartButton">
        SCAN AGAIN
      </button>


      <button id="addInventoryButton">
        ADD TO INVENTORY
      </button>

    </div>


  </div>



  <script>


    /*
    ====================================================
    CONFIGURATION
    ====================================================
    */


    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbxeFrEttl7fh8lmSzBJGO852xYTTsV5BrjHssoj2IK4biAhJLApLMs1qUIbbAlsbHWXsw/exec";


    const SCAN_INTERVAL =
      250;


    const JPEG_QUALITY =
      0.88;


    const APPSHEET_APP_ID =
      "c9b42286-9e3c-4647-a376-6b7823b93237";


    const APPSHEET_FORM_VIEW =
      "A-to-Z Yard Inventory V1_Form";



    /*
    ====================================================
    ELEMENTS
    ====================================================
    */


    const video =
      document.getElementById(
        "camera"
      );


    const canvas =
      document.getElementById(
        "captureCanvas"
      );


    const scanArea =
      document.getElementById(
        "scanArea"
      );


    const statusText =
      document.getElementById(
        "status"
      );


    const resultText =
      document.getElementById(
        "result"
      );


    const detailsText =
      document.getElementById(
        "details"
      );


    const restartButton =
      document.getElementById(
        "restartButton"
      );


    const addInventoryButton =
      document.getElementById(
        "addInventoryButton"
      );



    /*
    ====================================================
    STATE
    ====================================================
    */


    let scanning =
      false;


    let locked =
      false;


    let timer =
      null;


    let cameraStream =
      null;


    let detectedVin =
      "";



    /*
    ====================================================
    START CAMERA
    ====================================================
    */


    async function startCamera() {

      try {


        statusText.textContent =
          "Opening camera...";


        detailsText.textContent =
          "";


        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Camera is not supported by this browser."
          );

        }


        const constraints = {

          audio: false,

          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          }

        };


        cameraStream =
          await navigator.mediaDevices
            .getUserMedia(
              constraints
            );


        video.srcObject =
          cameraStream;


        await video.play();


        await waitForVideo();


        await tryCameraEnhancements(
          cameraStream
        );


        statusText.textContent =
          "Point at VIN";


        detailsText.textContent =
          "Cloud Vision scanner ready";


        scanning =
          true;


        locked =
          false;


        scheduleNextScan(
          500
        );


      }

      catch (error) {


        console.error(
          "CAMERA ERROR:",
          error
        );


        statusText.textContent =
          "Camera error";


        detailsText.textContent =
          error.message ||
          String(error);


      }

    }



    /*
    ====================================================
    WAIT FOR CAMERA
    ====================================================
    */


    function waitForVideo() {

      return new Promise(
        function(resolve) {


          if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
          ) {

            resolve();

            return;

          }


          video.addEventListener(
            "loadedmetadata",

            function() {

              resolve();

            },

            {
              once: true
            }

          );


        }
      );

    }



    /*
    ====================================================
    CAMERA ENHANCEMENTS
    ====================================================
    */


    async function tryCameraEnhancements(
      stream
    ) {

      try {


        const track =
          stream.getVideoTracks()[0];


        if (!track) {

          return;

        }


        const capabilities =
          track.getCapabilities
            ? track.getCapabilities()
            : {};


        const advanced =
          {};


        if (
          capabilities.focusMode &&
          capabilities.focusMode.includes(
            "continuous"
          )
        ) {

          advanced.focusMode =
            "continuous";

        }


        if (
          capabilities.exposureMode &&
          capabilities.exposureMode.includes(
            "continuous"
          )
        ) {

          advanced.exposureMode =
            "continuous";

        }


        if (
          capabilities.whiteBalanceMode &&
          capabilities.whiteBalanceMode.includes(
            "continuous"
          )
        ) {

          advanced.whiteBalanceMode =
            "continuous";

        }


        if (
          Object.keys(
            advanced
          ).length > 0
        ) {

          await track.applyConstraints({

            advanced: [
              advanced
            ]

          });

        }


      }

      catch (error) {


        console.log(
          "Camera enhancement skipped:",
          error
        );


      }

    }



    /*
    ====================================================
    CAPTURE GREEN BOX
    ====================================================
    */


    function captureVinArea() {


      const videoRect =
        video.getBoundingClientRect();


      const scanRect =
        scanArea.getBoundingClientRect();


      const sourceWidth =
        video.videoWidth;


      const sourceHeight =
        video.videoHeight;


      if (
        !sourceWidth ||
        !sourceHeight
      ) {

        throw new Error(
          "Camera not ready."
        );

      }


      const scale =
        Math.max(

          videoRect.width /
            sourceWidth,

          videoRect.height /
            sourceHeight

        );


      const displayedWidth =
        sourceWidth *
        scale;


      const displayedHeight =
        sourceHeight *
        scale;


      const offsetX =
        (
          displayedWidth -
          videoRect.width
        ) / 2;


      const offsetY =
        (
          displayedHeight -
          videoRect.height
        ) / 2;


      let x =
        (
          scanRect.left -
          videoRect.left +
          offsetX
        ) / scale;


      let y =
        (
          scanRect.top -
          videoRect.top +
          offsetY
        ) / scale;


      let width =
        scanRect.width /
        scale;


      let height =
        scanRect.height /
        scale;


      const horizontalPadding =
        width *
        0.04;


      const verticalPadding =
        height *
        0.15;


      x -=
        horizontalPadding;


      y -=
        verticalPadding;


      width +=
        horizontalPadding *
        2;


      height +=
        verticalPadding *
        2;


      x =
        Math.max(
          0,
          x
        );


      y =
        Math.max(
          0,
          y
        );


      width =
        Math.min(
          width,
          sourceWidth - x
        );


      height =
        Math.min(
          height,
          sourceHeight - y
        );


      const targetWidth =
        1400;


      const outputScale =
        Math.max(

          1,

          targetWidth /
            width

        );


      canvas.width =
        Math.round(
          width *
          outputScale
        );


      canvas.height =
        Math.round(
          height *
          outputScale
        );


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.imageSmoothingEnabled =
        true;


      ctx.imageSmoothingQuality =
        "high";


      ctx.drawImage(

        video,

        x,
        y,

        width,
        height,

        0,
        0,

        canvas.width,
        canvas.height

      );


      return canvas.toDataURL(

        "image/jpeg",

        JPEG_QUALITY

      );

    }



    /*
    ====================================================
    SEND IMAGE TO CLOUD VISION
    ====================================================
    */


    async function sendImage(
      imageData
    ) {


      const response =
        await fetch(

          BACKEND_URL,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify({

                action:
                  "scanVin",

                image:
                  imageData

              }),

            redirect:
              "follow"

          }

        );


      if (!response.ok) {

        throw new Error(
          "Backend HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );

      }

      catch (error) {

        console.error(
          "INVALID BACKEND RESPONSE:",
          text
        );

        throw new Error(
          "Backend returned invalid JSON."
        );

      }

    }



    /*
    ====================================================
    LOCAL VIN VALIDATION
    ====================================================
    */


    function isValidVin(
      vin
    ) {


      return (

        typeof vin ===
          "string" &&

        /^[A-HJ-NPR-Z0-9]{17}$/
          .test(
            vin
          )

      );

    }



    /*
    ====================================================
    AUTOMATIC SCANNER
    ====================================================
    */


    async function scanFrame() {


      if (
        !scanning ||
        locked
      ) {

        return;

      }


      try {


        statusText.textContent =
          "Reading VIN...";


        const image =
          captureVinArea();


        const result =
          await sendImage(
            image
          );


        console.log(
          "CLOUD VISION RESULT:",
          result
        );


        if (
          result &&
          result.success === true &&
          result.found === true &&
          isValidVin(
            result.vin
          )
        ) {


          lockVin(
            result.vin
          );


          return;

        }


        if (
          result &&
          result.success === true &&
          result.found === false
        ) {


          statusText.textContent =
            "Point at VIN";


          if (
            result.visionText
          ) {


            detailsText.textContent =
              "Vision saw: " +
              result.visionText;


          }

          else if (
            result.ocr
          ) {


            detailsText.textContent =
              "Vision saw: " +
              result.ocr;


          }

          else {


            detailsText.textContent =
              "Vision found no text";


          }

        }


        else if (
          result &&
          result.success === false
        ) {


          statusText.textContent =
            "Backend error";


          detailsText.textContent =
            result.error ||
            "Unknown backend error";


        }


      }

      catch (error) {


        console.error(
          "SCANNER ERROR:",
          error
        );


        statusText.textContent =
          "Scanner error";


        detailsText.textContent =
          error.message ||
          String(error);


      }


      scheduleNextScan(
        SCAN_INTERVAL
      );

    }



    /*
    ====================================================
    SCHEDULE NEXT SCAN
    ====================================================
    */


    function scheduleNextScan(
      delay
    ) {


      clearTimeout(
        timer
      );


      timer =
        setTimeout(

          scanFrame,

          delay

        );

    }



    /*
    ====================================================
    VIN DETECTED
    ====================================================
    */


    function lockVin(
      vin
    ) {


      locked =
        true;


      scanning =
        false;


      detectedVin =
        vin;


      clearTimeout(
        timer
      );


      statusText.textContent =
        "VIN DETECTED ✓";


      resultText.textContent =
        vin;


      detailsText.textContent =
        "Cloud Vision verified 17-character VIN";


      scanArea.style.borderColor =
        "#00ff66";


      restartButton.style.display =
        "block";


      addInventoryButton.style.display =
        "block";


      if (
        navigator.vibrate
      ) {


        navigator.vibrate(
          [
            100,
            60,
            100
          ]
        );


      }

    }



    /*
    ====================================================
    SCAN AGAIN
    ====================================================
    */


    restartButton.addEventListener(

      "click",

      function() {


        locked =
          false;


        scanning =
          true;


        detectedVin =
          "";


        resultText.textContent =
          "";


        detailsText.textContent =
          "Cloud Vision scanner ready";


        statusText.textContent =
          "Point at VIN";


        restartButton.style.display =
          "none";


        addInventoryButton.style.display =
          "none";


        scheduleNextScan(
          300
        );


      }

    );



    /*
    ====================================================
    ADD TO INVENTORY
    ====================================================

    NEXT STEP:
    Decode VIN -> Year / Make / Model
    Then open AppSheet form with all 4 values.
    ====================================================
    */


    addInventoryButton.addEventListener(

      "click",

      function() {


        if (
          !detectedVin
        ) {

          return;

        }


        statusText.textContent =
          "VIN READY ✓";


        detailsText.textContent =
          "Next: connect vehicle information to inventory";


      }

    );



    /*
    ====================================================
    START
    ====================================================
    */


    window.addEventListener(

      "load",

      startCamera

    );


  </script>


</body>

</html>
