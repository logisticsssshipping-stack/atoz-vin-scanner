<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>A-to-Z VIN Scanner</title>

  <!-- OCR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 5px 0;
    }

    .subtitle {
      color: #aaa;
      margin: 8px 0 18px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: auto;
      background: black;
      border-radius: 14px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      display: block;
      background: black;
    }

    #vinGuide {
      position: absolute;
      left: 4%;
      right: 4%;
      top: 40%;
      height: 85px;
      border: 3px solid #00ff88;
      border-radius: 8px;
      pointer-events: none;
    }

    #guideLabel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(40% - 30px);
      color: #00ff88;
      font-weight: bold;
      font-size: 13px;
      text-shadow: 1px 1px 3px black;
    }

    button {
      width: 100%;
      max-width: 700px;
      padding: 16px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
    }

    #scanButton {
      background: #1478ff;
      color: white;
    }

    #retryButton {
      display: none;
      background: #444;
      color: white;
    }

    #status {
      margin: 16px auto;
      max-width: 700px;
      min-height: 25px;
      color: #ddd;
    }

    #result {
      display: none;
      max-width: 700px;
      margin: 15px auto;
      padding: 18px;
      background: #222;
      border-radius: 12px;
    }

    #vinResult {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 8px;
      word-break: break-all;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<h1>A-to-Z Yard</h1>

<div class="subtitle">
  VIN Scanner
</div>


<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="guideLabel">
    PLACE THE VIN INSIDE THIS BOX
  </div>

  <div id="vinGuide"></div>

</div>

<button id="confirmButton" style="display:none; background:#00b86b; color:white;">
  CONFIRM VIN
</button>
  
<button id="scanButton" disabled>
  STARTING CAMERA...
</button>


<div id="status">
  Requesting camera access...
</div>


<div id="result">

  <div>
    VIN DETECTED
  </div>

  <div id="vinResult"></div>

</div>


<button id="retryButton">
  SCAN AGAIN
</button>


<canvas id="canvas"></canvas>


<script>

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const scanButton =
  document.getElementById("scanButton");

const retryButton =
  document.getElementById("retryButton");

  const confirmButton =
  document.getElementById("confirmButton");

let detectedVIN = "";
  
const statusBox =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const vinResult =
  document.getElementById("vinResult");

let stream = null;

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxeFrEttl7fh8lmSzBJGO852xYTTsV5BrjHssoj2IK4biAhJLApLMs1qUIbbAlsbHWXsw/exec";

const params = new URLSearchParams(window.location.search);
const UNIT_ID = params.get("unitId") || "";
/* ==============================
   START PHONE CAMERA
================================ */

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        "This browser does not support camera access."
      );
    }


    statusBox.innerText =
      "Waiting for camera permission...";


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    await waitUntilCameraReady();


    statusBox.innerText =
      "Camera ready — place the VIN inside the green box.";


    scanButton.disabled =
      false;


    scanButton.innerText =
      "SCAN VIN";


  } catch (error) {

    console.error(error);


    statusBox.innerText =
      "CAMERA ERROR: " +
      error.message;


    scanButton.innerText =
      "CAMERA NOT AVAILABLE";


    scanButton.disabled =
      true;
  }
}


/* ==============================
   WAIT FOR VIDEO
================================ */

function waitUntilCameraReady() {

  return new Promise(
    function(resolve, reject) {

      let attempts =
        0;


      const check =
        setInterval(
          function() {

            attempts++;


            if (
              video.videoWidth > 0 &&
              video.videoHeight > 0
            ) {

              clearInterval(check);

              resolve();

            }


            if (attempts >= 60) {

              clearInterval(check);

              reject(
                new Error(
                  "Camera opened but video did not become ready."
                )
              );

            }

          },

          100
        );

    }
  );
}


/* ==============================
   SCAN BUTTON
================================ */

scanButton.addEventListener(
  "click",
  scanVIN
);


async function scanVIN() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    statusBox.innerText =
      "Camera is not ready yet.";

    return;
  }


  scanButton.disabled =
    true;


  scanButton.innerText =
    "READING VIN...";


  statusBox.innerText =
    "Hold the phone steady...";


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  /*
    Crop the middle of the camera image.
    The green box is approximately here.
  */

  const cropX =
    Math.floor(
      width * 0.03
    );


  const cropY =
    Math.floor(
      height * 0.34
    );


  const cropWidth =
    Math.floor(
      width * 0.94
    );


  const cropHeight =
    Math.floor(
      height * 0.32
    );


  canvas.width =
    cropWidth;


  canvas.height =
    cropHeight;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.drawImage(

    video,

    cropX,
    cropY,
    cropWidth,
    cropHeight,

    0,
    0,
    cropWidth,
    cropHeight

  );


  enhanceImage(
    ctx,
    cropWidth,
    cropHeight
  );


  try {

    const result =
      await Tesseract.recognize(

        canvas,

        "eng",

        {

          logger:
            function(message) {

              if (
                message.status ===
                "recognizing text"
              ) {

                const percentage =
                  Math.round(
                    message.progress * 100
                  );


                statusBox.innerText =
                  "Reading VIN... " +
                  percentage +
                  "%";

              }

            }

        }

      );


    const text =
      String(
        result.data.text || ""
      ).toUpperCase();


    console.log(
      "OCR TEXT:",
      text
    );


    const vin =
      findVIN(text);


    if (!vin) {

      statusBox.innerText =
        "VIN not detected. Move closer, keep the VIN straight and try again.";


      scanButton.disabled =
        false;


      scanButton.innerText =
        "SCAN AGAIN";


      return;
    }


    vinResult.innerText =
      vin;
detectedVIN = vin;
confirmButton.style.display = "block";

    resultBox.style.display =
      "block";


    scanButton.style.display =
      "none";


    retryButton.style.display =
      "block";


    statusBox.innerText =
      "VIN detected successfully.";


  } catch (error) {

    console.error(error);


    statusBox.innerText =
      "OCR ERROR: " +
      error.message;


    scanButton.disabled =
      false;


    scanButton.innerText =
      "SCAN AGAIN";
  }
}


/* ==============================
   IMAGE ENHANCEMENT
================================ */

function enhanceImage(
  ctx,
  width,
  height
) {

  const image =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );


  const data =
    image.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =
      (
        0.299 * data[i]
      ) +
      (
        0.587 * data[i + 1]
      ) +
      (
        0.114 * data[i + 2]
      );


    /*
      Convert image to strong
      black/white contrast.
    */

    const value =
      gray > 140
        ? 255
        : 0;


    data[i] =
      value;


    data[i + 1] =
      value;


    data[i + 2] =
      value;

  }


  ctx.putImageData(
    image,
    0,
    0
  );
}


/* ==============================
   FIND 17 CHARACTER VIN
================================ */

function findVIN(text) {

  /*
    VIN:
    17 characters
    A-Z + 0-9
    I, O and Q are excluded.
  */


  const lines =
    text.split(
      /\r?\n/
    );


  for (
    let line of lines
  ) {

    const clean =
      line
        .toUpperCase()
        .replace(
          /[^A-Z0-9]/g,
          ""
        );


    const match =
      clean.match(
        /[A-HJ-NPR-Z0-9]{17}/
      );


    if (match) {

      return match[0];

    }

  }


  /*
    Second attempt:
    combine all OCR text.
  */

  const all =
    text
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );


  const match =
    all.match(
      /[A-HJ-NPR-Z0-9]{17}/
    );


  if (match) {

    return match[0];

  }


  return null;
}


/* ==============================
   RETRY
================================ */

retryButton.addEventListener(
  "click",
  function() {

    vinResult.innerText =
      "";


    resultBox.style.display =
      "none";


    retryButton.style.display =
      "none";


    scanButton.style.display =
      "block";


    scanButton.disabled =
      false;


    scanButton.innerText =
      "SCAN VIN";


    statusBox.innerText =
      "Place the VIN inside the green box.";

  }
);

confirmButton.addEventListener("click", async function () {

  if (!detectedVIN) {
    statusBox.innerText = "No VIN detected.";
    return;
  }

  if (!UNIT_ID) {
    statusBox.innerText =
      "Scanner works, but no Unit ID was received from AppSheet yet.";
    return;
  }

  confirmButton.disabled = true;

  statusBox.innerText =
    "Saving VIN to inventory...";

  const saveURL =
    APPS_SCRIPT_URL +
    "?action=save" +
    "&unitId=" + encodeURIComponent(UNIT_ID) +
    "&vin=" + encodeURIComponent(detectedVIN);

  try {

    await fetch(saveURL, {
      method: "GET",
      mode: "no-cors"
    });

    statusBox.innerText =
      "VIN SENT SUCCESSFULLY";

    confirmButton.style.display = "none";
    retryButton.style.display = "none";

  } catch (error) {

    statusBox.innerText =
      "SAVE ERROR: " + error.message;

    confirmButton.disabled = false;
  }

});
/* ==============================
   START
================================ */

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
