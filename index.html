<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>A-to-Z VIN Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #0d0f12;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
      font-size: 25px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 18px;
    }

    #cameraBox {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: auto;
      background: black;
      overflow: hidden;
      border-radius: 14px;
    }

    video {
      width: 100%;
      display: block;
      background: black;
    }

    #vinGuide {
      position: absolute;
      left: 3%;
      right: 3%;
      top: 42%;
      height: 70px;

      border: 3px solid #00ff88;
      border-radius: 8px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.18),
        0 0 15px rgba(0,255,136,0.4);

      pointer-events: none;
    }

    #guideLabel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(42% - 31px);

      color: #00ff88;
      font-weight: bold;
      font-size: 13px;

      text-shadow: 1px 1px 3px black;
    }

    #scanIndicator {
      display: none;

      position: absolute;
      left: 3%;
      right: 3%;
      top: 42%;

      height: 3px;

      background: #00ff88;

      box-shadow:
        0 0 10px #00ff88;

      animation: scanMove 1.2s infinite alternate;
    }

    @keyframes scanMove {
      from {
        transform: translateY(5px);
      }

      to {
        transform: translateY(62px);
      }
    }

    button {
      width: 100%;
      max-width: 700px;

      padding: 16px;
      margin-top: 14px;

      border: 0;
      border-radius: 10px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
    }

    #scanButton {
      background: #1478ff;
      color: white;
    }

    #confirmButton {
      display: none;
      background: #00b86b;
      color: white;
    }

    #retryButton {
      display: none;
      background: #444;
      color: white;
    }

    #manualButton {
      background: transparent;
      color: #aaa;
      border: 1px solid #444;
    }

    #status {
      margin: 16px auto;
      max-width: 700px;
      min-height: 25px;
      color: #ddd;
    }

    #attemptInfo {
      margin: 5px auto;
      color: #777;
      font-size: 13px;
      min-height: 16px;
    }

    #result {
      display: none;

      max-width: 700px;

      margin: 15px auto;
      padding: 18px;

      background: #1b1e22;
      border-radius: 12px;

      border: 1px solid #333;
    }

    .detectedLabel {
      color: #00ff88;
      font-size: 13px;
      font-weight: bold;
    }

    #vinResult {
      margin-top: 8px;

      font-size: 22px;
      font-weight: bold;

      letter-spacing: 1.5px;
      word-break: break-all;
    }

    #vehicleResult {
      margin-top: 12px;

      font-size: 19px;

      color: #00ff88;
    }

    #manualBox {
      display: none;

      max-width: 700px;

      margin: 15px auto;
      padding: 16px;

      background: #1b1e22;
      border-radius: 12px;
    }

    #manualVIN {
      width: 100%;

      padding: 15px;

      border-radius: 8px;
      border: 1px solid #555;

      background: #111;
      color: white;

      text-transform: uppercase;

      font-size: 18px;
      letter-spacing: 1px;
    }

    #manualSubmit {
      background: #1478ff;
      color: white;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>A-to-Z Yard</h1>

  <div class="subtitle">
    Smart Vehicle VIN Scanner
  </div>

  <div id="cameraBox">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div id="guideLabel">
      ALIGN ALL 17 VIN CHARACTERS INSIDE BOX
    </div>

    <div id="vinGuide"></div>

    <div id="scanIndicator"></div>

  </div>

  <button
    id="scanButton"
    disabled>
    STARTING CAMERA...
  </button>

  <div id="status">
    Requesting camera access...
  </div>

  <div id="attemptInfo"></div>

  <div id="result">

    <div class="detectedLabel">
      VIN DETECTED
    </div>

    <div id="vinResult"></div>

    <div id="vehicleResult"></div>

  </div>

  <button id="confirmButton">
    CONFIRM VIN & CONTINUE
  </button>

  <button id="retryButton">
    SCAN AGAIN
  </button>

  <button id="manualButton">
    ENTER VIN MANUALLY
  </button>

  <div id="manualBox">

    <input
      id="manualVIN"
      maxlength="17"
      autocomplete="off"
      autocapitalize="characters"
      placeholder="ENTER 17-CHARACTER VIN"
    >

    <button id="manualSubmit">
      USE THIS VIN
    </button>

  </div>

  <canvas id="canvas"></canvas>
  <canvas id="processedCanvas"></canvas>

<script>

/* =========================================
   APPSHEET
========================================= */

const APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";

const FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";


/* =========================================
   ELEMENTS
========================================= */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const processedCanvas =
  document.getElementById("processedCanvas");

const scanButton =
  document.getElementById("scanButton");

const confirmButton =
  document.getElementById("confirmButton");

const retryButton =
  document.getElementById("retryButton");

const manualButton =
  document.getElementById("manualButton");

const manualBox =
  document.getElementById("manualBox");

const manualVIN =
  document.getElementById("manualVIN");

const manualSubmit =
  document.getElementById("manualSubmit");

const statusBox =
  document.getElementById("status");

const attemptInfo =
  document.getElementById("attemptInfo");

const resultBox =
  document.getElementById("result");

const vinResult =
  document.getElementById("vinResult");

const vehicleResult =
  document.getElementById("vehicleResult");

const scanIndicator =
  document.getElementById("scanIndicator");


/* =========================================
   VARIABLES
========================================= */

let stream = null;

let scanning = false;

let detectedVIN = "";

let detectedYear = "";

let detectedMake = "";

let detectedModel = "";

let worker = null;

const candidateVotes = {};

const MAX_ROUNDS = 6;

const REQUIRED_VOTES = 2;


/* =========================================
   CAMERA
========================================= */

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        "Camera not supported by this browser."
      );
    }

    statusBox.innerText =
      "Waiting for camera permission...";

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });

    video.srcObject =
      stream;

    await video.play();

    await waitForCamera();

    await setupCameraFocus();

    statusBox.innerText =
      "Camera ready. Align the full VIN inside the green box.";

    scanButton.disabled =
      false;

    scanButton.innerText =
      "SCAN VIN";

  } catch (error) {

    console.error(error);

    statusBox.innerText =
      "CAMERA ERROR: " +
      error.message;

    scanButton.innerText =
      "CAMERA NOT AVAILABLE";

  }

}


function waitForCamera() {

  return new Promise(
    function(resolve, reject) {

      let tries = 0;

      const timer =
        setInterval(
          function() {

            tries++;

            if (
              video.videoWidth > 0 &&
              video.videoHeight > 0
            ) {

              clearInterval(timer);

              resolve();

            }

            if (tries > 60) {

              clearInterval(timer);

              reject(
                new Error(
                  "Camera opened but video was not ready."
                )
              );

            }

          },
          100
        );

    }
  );

}


/* =========================================
   CAMERA FOCUS
========================================= */

async function setupCameraFocus() {

  try {

    const track =
      stream.getVideoTracks()[0];

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};

    const constraints = {
      advanced: []
    };

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      constraints.advanced.push({
        focusMode: "continuous"
      });

    }

    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      constraints.advanced.push({
        exposureMode: "continuous"
      });

    }

    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      constraints.advanced.push({
        whiteBalanceMode: "continuous"
      });

    }

    if (constraints.advanced.length > 0) {

      await track.applyConstraints(
        constraints
      );

    }

  } catch (error) {

    console.log(
      "Advanced camera controls unavailable.",
      error
    );

  }

}


/* =========================================
   TESSERACT WORKER
========================================= */

async function prepareOCR() {

  if (worker) {
    return;
  }

  statusBox.innerText =
    "Preparing VIN reader...";

  worker =
    await Tesseract.createWorker(
      "eng",
      1,
      {
        logger: function(message) {

          if (
            message.status ===
            "recognizing text"
          ) {

            const percent =
              Math.round(
                message.progress * 100
              );

            statusBox.innerText =
              "Reading VIN... " +
              percent +
              "%";

          }

        }
      }
    );

  await worker.setParameters({

    tessedit_char_whitelist:
      "ABCDEFGHJKLMNPRSTUVWXYZ0123456789",

    preserve_interword_spaces:
      "1"

  });

}


/* =========================================
   START SCAN
========================================= */

scanButton.addEventListener(
  "click",
  startSmartScan
);


async function startSmartScan() {

  if (scanning) {
    return;
  }

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    statusBox.innerText =
      "Camera is not ready yet.";

    return;

  }

  scanning = true;

  detectedVIN = "";

  clearVotes();

  scanButton.disabled =
    true;

  scanButton.innerText =
    "SCANNING...";

  manualButton.style.display =
    "none";

  scanIndicator.style.display =
    "block";

  attemptInfo.innerText =
    "Starting smart scan...";

  try {

    await prepareOCR();

    for (
      let round = 1;
      round <= MAX_ROUNDS;
      round++
    ) {

      if (!scanning) {
        break;
      }

      attemptInfo.innerText =
        "Scan pass " +
        round +
        " of " +
        MAX_ROUNDS;

      statusBox.innerText =
        "Hold steady — looking for all 17 characters...";

      const source =
        captureVINArea();

      const variants = [
        createVariant(
          source,
          "contrast"
        ),

        createVariant(
          source,
          "thresholdLight"
        ),

        createVariant(
          source,
          "thresholdDark"
        )
      ];

      for (
        let variantIndex = 0;
        variantIndex < variants.length;
        variantIndex++
      ) {

        if (!scanning) {
          break;
        }

        const result =
          await worker.recognize(
            variants[variantIndex]
          );

        const text =
          String(
            result.data.text || ""
          ).toUpperCase();

        console.log(
          "ROUND",
          round,
          "VARIANT",
          variantIndex,
          text
        );

        const candidates =
          findVINCandidates(text);

        for (
          const candidate of candidates
        ) {

          registerCandidate(
            candidate
          );

          if (
            candidateVotes[candidate] >=
            REQUIRED_VOTES
          ) {

            await acceptVIN(
              candidate
            );

            return;

          }

        }

      }

      await sleep(300);

    }

    const best =
      getBestCandidate();

    if (best) {

      await acceptVIN(best);

      return;

    }

    scanning =
      false;

    scanIndicator.style.display =
      "none";

    statusBox.innerText =
      "VIN not detected clearly. Move closer, reduce glare and try again.";

    attemptInfo.innerText =
      "Make sure all 17 characters are visible.";

    scanButton.disabled =
      false;

    scanButton.innerText =
      "SCAN AGAIN";

    manualButton.style.display =
      "block";

  } catch (error) {

    console.error(error);

    scanning =
      false;

    scanIndicator.style.display =
      "none";

    statusBox.innerText =
      "SCAN ERROR: " +
      error.message;

    scanButton.disabled =
      false;

    scanButton.innerText =
      "SCAN AGAIN";

    manualButton.style.display =
      "block";

  }

}


/* =========================================
   CAPTURE VIN AREA
========================================= */

function captureVINArea() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  /*
    Capture slightly more than the visible
    green guide to tolerate phone positioning.
  */

  const cropX =
    Math.floor(
      width * 0.02
    );

  const cropY =
    Math.floor(
      height * 0.35
    );

  const cropWidth =
    Math.floor(
      width * 0.96
    );

  const cropHeight =
    Math.floor(
      height * 0.25
    );

  /*
    Upscaling helps OCR recognize
    smaller VIN characters.
  */

  const scale = 2;

  canvas.width =
    cropWidth * scale;

  canvas.height =
    cropHeight * scale;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";

  ctx.drawImage(

    video,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    canvas.width,
    canvas.height

  );

  return canvas;

}


/* =========================================
   IMAGE VARIANTS
========================================= */

function createVariant(
  source,
  mode
) {

  processedCanvas.width =
    source.width;

  processedCanvas.height =
    source.height;

  const ctx =
    processedCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );

  ctx.drawImage(
    source,
    0,
    0
  );

  const image =
    ctx.getImageData(
      0,
      0,
      processedCanvas.width,
      processedCanvas.height
    );

  const data =
    image.data;

  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    let gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    let value;

    if (
      mode ===
      "thresholdLight"
    ) {

      value =
        gray > 165
          ? 255
          : 0;

    }

    else if (
      mode ===
      "thresholdDark"
    ) {

      value =
        gray > 110
          ? 255
          : 0;

    }

    else {

      /*
        Strong contrast without
        completely destroying edges.
      */

      value =
        (gray - 128) *
        1.8 +
        128;

      value =
        Math.max(
          0,
          Math.min(
            255,
            value
          )
        );

    }

    data[i] =
      value;

    data[i + 1] =
      value;

    data[i + 2] =
      value;

  }

  ctx.putImageData(
    image,
    0,
    0
  );

  /*
    Copy this processed frame because
    the same canvas is reused.
  */

  const output =
    document.createElement(
      "canvas"
    );

  output.width =
    processedCanvas.width;

  output.height =
    processedCanvas.height;

  output
    .getContext("2d")
    .drawImage(
      processedCanvas,
      0,
      0
    );

  return output;

}


/* =========================================
   VIN EXTRACTION
========================================= */

function findVINCandidates(text) {

  const results =
    new Set();

  const lines =
    String(text)
      .toUpperCase()
      .split(/\r?\n/);

  for (
    const line of lines
  ) {

    processVINString(
      line,
      results
    );

  }

  processVINString(
    text,
    results
  );

  return Array.from(
    results
  );

}


function processVINString(
  text,
  results
) {

  let clean =
    String(text)
      .toUpperCase()
      .replace(
        /[^A-Z0-9]/g,
        ""
      );

  /*
    VINs never contain I, O or Q.
    OCR commonly mistakes these for
    1 and 0.
  */

  clean =
    clean
      .replace(/O/g, "0")
      .replace(/Q/g, "0")
      .replace(/I/g, "1");

  if (
    clean.length < 17
  ) {
    return;
  }

  /*
    OCR may include extra text around VIN.
    Test every 17-character window.
  */

  for (
    let i = 0;
    i <= clean.length - 17;
    i++
  ) {

    const candidate =
      clean.substring(
        i,
        i + 17
      );

    if (
      isVINFormat(candidate)
    ) {

      results.add(
        candidate
      );

    }

  }

}


/* =========================================
   VIN VALIDATION
========================================= */

function isVINFormat(vin) {

  if (
    !/^[A-HJ-NPR-Z0-9]{17}$/.test(
      vin
    )
  ) {
    return false;
  }

  /*
    Reject obviously bad OCR output
    containing almost no variation.
  */

  const unique =
    new Set(
      vin.split("")
    );

  if (
    unique.size < 5
  ) {
    return false;
  }

  return true;

}


/* =========================================
   MULTI-FRAME VOTING
========================================= */

function registerCandidate(vin) {

  if (
    !candidateVotes[vin]
  ) {

    candidateVotes[vin] =
      0;

  }

  candidateVotes[vin]++;

  console.log(
    "VIN CANDIDATE:",
    vin,
    "VOTES:",
    candidateVotes[vin]
  );

}


function clearVotes() {

  for (
    const key in candidateVotes
  ) {

    delete candidateVotes[key];

  }

}


function getBestCandidate() {

  let bestVIN =
    null;

  let bestVotes =
    0;

  for (
    const vin in candidateVotes
  ) {

    if (
      candidateVotes[vin] >
      bestVotes
    ) {

      bestVIN =
        vin;

      bestVotes =
        candidateVotes[vin];

    }

  }

  /*
    Only use fallback candidate when
    OCR produced something plausible.
  */

  if (
    bestVotes >= 1
  ) {

    return bestVIN;

  }

  return null;

}


/* =========================================
   VIN ACCEPTED
========================================= */

async function acceptVIN(vin) {

  scanning =
    false;

  scanIndicator.style.display =
    "none";

  detectedVIN =
    vin;

  vinResult.innerText =
    vin;

  resultBox.style.display =
    "block";

  scanButton.style.display =
    "none";

  manualButton.style.display =
    "none";

  manualBox.style.display =
    "none";

  attemptInfo.innerText =
    "";

  statusBox.innerText =
    "VIN detected. Getting vehicle information...";

  await decodeVIN(
    vin
  );

}


/* =========================================
   NHTSA DECODER
========================================= */

async function decodeVIN(vin) {

  try {

    const url =

      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/" +

      encodeURIComponent(vin) +

      "?format=json";

    const response =
      await fetch(url);

    if (!response.ok) {

      throw new Error(
        "VIN decoder did not respond."
      );

    }

    const data =
      await response.json();

    if (
      !data.Results ||
      data.Results.length === 0
    ) {

      throw new Error(
        "Vehicle information not found."
      );

    }

    const vehicle =
      data.Results[0];

    detectedYear =
      vehicle.ModelYear || "";

    detectedMake =
      vehicle.Make || "";

    detectedModel =
      vehicle.Model || "";

    const vehicleName =
      [
        detectedYear,
        detectedMake,
        detectedModel
      ]
      .filter(Boolean)
      .join(" ");

    vehicleResult.innerText =
      vehicleName ||
      "Vehicle details unavailable";

    statusBox.innerText =
      "Check VIN and vehicle details, then confirm.";

    confirmButton.style.display =
      "block";

    retryButton.style.display =
      "block";

  } catch (error) {

    console.error(error);

    statusBox.innerText =
      "VIN detected, but vehicle details could not be decoded.";

    vehicleResult.innerText =
      "VIN: " +
      detectedVIN;

    confirmButton.style.display =
      "block";

    retryButton.style.display =
      "block";

  }

}


/* =========================================
   MANUAL VIN
========================================= */

manualButton.addEventListener(
  "click",
  function() {

    manualBox.style.display =
      manualBox.style.display ===
      "block"
        ? "none"
        : "block";

    manualVIN.focus();

  }
);


manualVIN.addEventListener(
  "input",
  function() {

    this.value =
      this.value
        .toUpperCase()
        .replace(
          /[^A-HJ-NPR-Z0-9]/g,
          ""
        )
        .slice(
          0,
          17
        );

  }
);


manualSubmit.addEventListener(
  "click",
  async function() {

    const vin =
      manualVIN.value
        .trim()
        .toUpperCase();

    if (
      !isVINFormat(vin)
    ) {

      statusBox.innerText =
        "Please enter a valid 17-character VIN.";

      return;

    }

    await acceptVIN(
      vin
    );

  }
);


/* =========================================
   CONFIRM → APPSHEET
========================================= */

confirmButton.addEventListener(
  "click",
  function() {

    if (!detectedVIN) {

      statusBox.innerText =
        "No VIN detected.";

      return;

    }

    statusBox.innerText =
      "Opening vehicle receiving form...";

    const defaults = {

      "VIN":
        detectedVIN,

      "Year":
        detectedYear,

      "Make":
        detectedMake,

      "Model":
        detectedModel

    };

    const appUrl =

      "https://www.appsheet.com/start/" +

      APP_ID +

      "#control=" +

      encodeURIComponent(
        FORM_VIEW
      ) +

      "&defaults=" +

      encodeURIComponent(
        JSON.stringify(
          defaults
        )
      ) +

      "&page=form";

    window.location.href =
      appUrl;

  }
);


/* =========================================
   RETRY
========================================= */

retryButton.addEventListener(
  "click",
  function() {

    scanning =
      false;

    detectedVIN =
      "";

    detectedYear =
      "";

    detectedMake =
      "";

    detectedModel =
      "";

    clearVotes();

    vinResult.innerText =
      "";

    vehicleResult.innerText =
      "";

    resultBox.style.display =
      "none";

    confirmButton.style.display =
      "none";

    retryButton.style.display =
      "none";

    manualBox.style.display =
      "none";

    manualVIN.value =

    scanIndicator.style.display =

    scanButton.style.display =

    scanButton.disabled =

    scanButton.innerText =

    attemptInfo.innerText =

    statusBox.innerText =

);

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================
   START
========================================= */

window.addEventListener(
  "load",
  startCamera
);
