<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>A-to-Z VIN Scanner V4</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;

  background: #0b0d10;
  color: white;

  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 4px 0;
  font-size: 24px;
}

.subtitle {
  margin-bottom: 12px;
  color: #aaa;
}

#cameraBox {
  position: relative;

  width: 100%;
  max-width: 700px;

  margin: auto;

  background: black;

  overflow: hidden;
  border-radius: 14px;
}

video {
  width: 100%;
  display: block;
}

#shadeTop,
#shadeBottom {
  position: absolute;

  left: 0;
  right: 0;

  background: rgba(0,0,0,.42);

  pointer-events: none;
}

#shadeTop {
  top: 0;
  height: 43%;
}

#shadeBottom {
  bottom: 0;
  height: 45%;
}

#vinGuide {
  position: absolute;

  left: 3%;
  right: 3%;

  top: 43%;
  height: 12%;

  min-height: 55px;

  border: 3px solid #00ff88;
  border-radius: 9px;

  box-shadow:
    0 0 14px rgba(0,255,136,.65);

  pointer-events: none;
}

#guideText {
  position: absolute;

  left: 0;
  right: 0;

  top: calc(43% - 30px);

  color: #00ff88;

  font-size: 13px;
  font-weight: bold;

  text-shadow: 0 1px 4px black;

  pointer-events: none;
}

#scanLine {
  display: none;

  position: absolute;

  left: 4%;
  right: 4%;

  top: 44%;

  height: 2px;

  background: #00ff88;

  box-shadow:
    0 0 10px #00ff88;

  animation:
    scannerMove .85s infinite alternate ease-in-out;
}

@keyframes scannerMove {

  from {
    transform: translateY(2px);
  }

  to {
    transform: translateY(43px);
  }

}

#status {
  max-width: 700px;

  margin: 14px auto 5px;

  min-height: 24px;

  font-size: 16px;

  color: #ddd;
}

#smallStatus {
  max-width: 700px;

  margin: 5px auto 12px;

  min-height: 18px;

  font-size: 13px;

  color: #888;
}

#result {
  display: none;

  max-width: 700px;

  margin: 14px auto;

  padding: 18px;

  border-radius: 12px;

  background: #1a1d21;

  border: 1px solid #333;
}

.success {
  color: #00ff88;

  font-size: 14px;
  font-weight: bold;
}

#vinResult {
  margin-top: 9px;

  font-size: 23px;
  font-weight: bold;

  letter-spacing: 1.3px;

  word-break: break-all;
}

  margin-top: 12px;

  font-size: 19px;

  color: #00ff88;
}

button {
  width: 100%;
  max-width: 700px;

  margin-top: 10px;

  padding: 16px;

  border: 0;
  border-radius: 10px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

#confirmButton {
  display: none;

  background: #00b86b;

  color: white;
}

#retryButton {
  display: none;

  background: #333;

  color: white;
}

#manualButton {
  background: transparent;

  color: #aaa;

  border: 1px solid #444;
}

#manualBox {
  display: none;

  max-width: 700px;

  margin: 12px auto;

  padding: 14px;

  border-radius: 10px;

  background: #191c20;
}

#manualVIN {
  width: 100%;

  padding: 14px;

  background: #0d0f12;
  color: white;

  border: 1px solid #555;
  border-radius: 8px;

  font-size: 18px;

  letter-spacing: 1px;

  text-transform: uppercase;
}

#manualSubmit {
  background: #1478ff;
  color: white;
}

canvas {
  display: none;
}

</style>
</head>

<body>


<h1>A-to-Z Yard</h1>

<div class="subtitle">
  VIN Scanner V4
</div>


<div id="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div id="shadeTop"></div>

  <div id="shadeBottom"></div>

  <div id="guideText">
    ALIGN ONLY THE 17-CHARACTER VIN
  </div>

  <div id="vinGuide"></div>

  <div id="scanLine"></div>

</div>


<div id="status">
  Starting camera...
</div>

<div id="smallStatus">
  Scanning starts automatically.
</div>


<div id="result">

  <div class="success">
    ✓ VIN VERIFIED
  </div>

  <div id="vinResult"></div>

  <div id="vehicleResult"></div>

</div>


<button id="confirmButton">
  CONFIRM & CONTINUE
</button>


<button id="retryButton">
  SCAN AGAIN
</button>


<button id="manualButton">
  ENTER VIN MANUALLY
</button>


<div id="manualBox">

  <input
    id="manualVIN"
    maxlength="17"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="17-CHARACTER VIN">

  <button id="manualSubmit">
    CHECK VIN
  </button>

</div>


<canvas id="captureCanvas"></canvas>


<script>

/* =====================================================
   APPSHEET
===================================================== */

const APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";

const FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("video");

const captureCanvas =
  document.getElementById("captureCanvas");

const statusBox =
  document.getElementById("status");

const smallStatus =
  document.getElementById("smallStatus");

const scanLine =
  document.getElementById("scanLine");

const resultBox =
  document.getElementById("result");

const vinResult =
  document.getElementById("vinResult");

const vehicleResult =
  document.getElementById("vehicleResult");

const confirmButton =
  document.getElementById("confirmButton");

const retryButton =
  document.getElementById("retryButton");

const manualButton =
  document.getElementById("manualButton");

const manualBox =
  document.getElementById("manualBox");

const manualVIN =
  document.getElementById("manualVIN");

const manualSubmit =
  document.getElementById("manualSubmit");


/* =====================================================
   STATE
===================================================== */

let stream = null;

let worker = null;

let scanning = false;

let verifying = false;

let detectedVIN = "";

let detectedYear = "";

let detectedMake = "";

let detectedModel = "";

let scanPass = 0;

const checkedCandidates =
  new Set();

const MAX_PASSES = 12;


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

  try {

    statusBox.innerText =
      "Opening rear camera...";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported by this browser."
      );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    await waitForVideo();


    await configureCamera();


    statusBox.innerText =
      "Loading VIN reader...";


    await prepareOCR();


    await sleep(250);


    startAutomaticScan();

  }

  catch (error) {

    console.error(error);


    statusBox.innerText =
      "Camera error: " +
      error.message;


    smallStatus.innerText =
      "Use manual VIN entry below.";

  }

}


/* =====================================================
   WAIT FOR VIDEO
===================================================== */

function waitForVideo() {

  return new Promise(
    function(resolve, reject) {

      let attempts = 0;


      const timer =
        setInterval(
          function() {

            attempts++;


            if (
              video.videoWidth > 0 &&
              video.videoHeight > 0
            ) {

              clearInterval(timer);

              resolve();

            }


            if (
              attempts > 80
            ) {

              clearInterval(timer);


              reject(
                new Error(
                  "Camera did not start."
                )
              );

            }

          },

          100
        );

    }
  );

}


/* =====================================================
   CAMERA CONFIG
===================================================== */

async function configureCamera() {

  try {

    const track =
      stream.getVideoTracks()[0];


    if (!track) {
      return;
    }


    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    const advanced = [];


    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        focusMode: "continuous"
      });

    }


    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        exposureMode: "continuous"
      });

    }


    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.push({
        whiteBalanceMode: "continuous"
      });

    }


    if (
      advanced.length
    ) {

      await track.applyConstraints({
        advanced: advanced
      });

    }

  }

  catch (error) {

    console.log(
      "Advanced camera controls unavailable.",
      error
    );

  }

}


/* =====================================================
   OCR
===================================================== */

async function prepareOCR() {

  if (worker) {
    return;
  }


  worker =
    await Tesseract.createWorker(
      "eng"
    );


  await worker.setParameters({

    tessedit_char_whitelist:
      "ABCDEFGHJKLMNPRSTUVWXYZ0123456789",

    tessedit_pageseg_mode:
      "7",

    preserve_interword_spaces:
      "0"

  });

}


/* =====================================================
   BEGIN SCAN
===================================================== */

function startAutomaticScan() {

  scanning = true;

  verifying = false;

  scanPass = 0;


  checkedCandidates.clear();


  detectedVIN = "";

  detectedYear = "";

  detectedMake = "";

  detectedModel = "";


  resultBox.style.display =
    "none";


  confirmButton.style.display =
    "none";


  retryButton.style.display =
    "none";


  manualBox.style.display =
    "none";


  manualButton.style.display =
    "block";


  scanLine.style.display =
    "block";


  statusBox.innerText =
    "Scanning VIN...";


  smallStatus.innerText =
    "Keep all 17 characters centered in the green box.";


  runScanLoop();

}


/* =====================================================
   SCAN LOOP
===================================================== */

async function runScanLoop() {

  while (
    scanning &&
    scanPass < MAX_PASSES
  ) {

    scanPass++;


    smallStatus.innerText =
      "Reading VIN • pass " +
      scanPass;


    /*
      Capture a fresh frame on every pass.
    */

    const frame =
      captureVINStrip();


    /*
      V4:
      Try several OCR-friendly versions of
      the SAME tight VIN strip.
    */

    const variants = [

      makeVariant(
        frame,
        "normal"
      ),

      makeVariant(
        frame,
        "contrast"
      ),

      makeVariant(
        frame,
        "threshold130"
      ),

      makeVariant(
        frame,
        "threshold160"
      ),

      makeVariant(
        frame,
        "invert"
      )

    ];


    for (
      const image of variants
    ) {

      if (!scanning) {
        return;
      }


      let result;


      try {

        result =
          await worker.recognize(
            image
          );

      }

      catch (error) {

        console.log(
          "OCR pass error:",
          error
        );

        continue;

      }


      const rawText =
        String(
          result.data.text || ""
        )
        .toUpperCase();


      console.log(
        "OCR V4:",
        rawText
      );


      const candidates =
        extractCandidates(
          rawText
        );


      console.log(
        "Candidates:",
        candidates
      );


      for (
        const candidate of candidates
      ) {

        if (!scanning) {
          return;
        }


        /*
          Do not waste network calls checking
          the same candidate repeatedly.
        */

        if (
          checkedCandidates.has(
            candidate
          )
        ) {

          continue;

        }


        checkedCandidates.add(
          candidate
        );


        statusBox.innerText =
          "Checking " +
          candidate +
          "...";


        verifying = true;


        const vehicle =
          await verifyVIN(
            candidate
          );


        verifying = false;


        if (
          vehicle
        ) {

          lockVIN(
            candidate,
            vehicle
          );

          return;

        }


        statusBox.innerText =
          "Scanning VIN...";

      }

    }


    /*
      Give autofocus a moment to adjust
      before capturing another frame.
    */

    await sleep(
      120
    );

  }


  if (scanning) {

    scanning = false;


    scanLine.style.display =
      "none";


    statusBox.innerText =
      "VIN not found yet.";


    smallStatus.innerText =
      "Center the VIN and try again.";


    retryButton.style.display =
      "block";

  }

}


/* =====================================================
   CAPTURE TIGHT VIN STRIP
===================================================== */

function captureVINStrip() {

  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  /*
    V4 IMPORTANT:

    The visible green box starts around 43%.

    We capture a NARROWER area inside it,
    concentrating on the actual VIN line
    rather than text underneath it.

    This directly addresses the
    "Storage 175$" test.
  */

  const cropX =
    Math.floor(
      videoWidth * 0.025
    );


  const cropY =
    Math.floor(
      videoHeight * 0.435
    );


  const cropWidth =
    Math.floor(
      videoWidth * 0.95
    );


  const cropHeight =
    Math.floor(
      videoHeight * 0.085
    );


  /*
    2.5x enlargement gives Tesseract
    more character pixels to work with.
  */

  const SCALE =
    2.5;


  captureCanvas.width =
    Math.floor(
      cropWidth * SCALE
    );


  captureCanvas.height =
    Math.floor(
      cropHeight * SCALE
    );


  const ctx =
    captureCanvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  ctx.clearRect(
    0,
    0,
    captureCanvas.width,
    captureCanvas.height
  );


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    video,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    captureCanvas.width,
    captureCanvas.height

  );


  return captureCanvas;

}


/* =====================================================
   IMAGE VARIANTS
===================================================== */

function makeVariant(
  source,
  mode
) {

  const output =
    document.createElement(
      "canvas"
    );


  output.width =
    source.width;


  output.height =
    source.height;


  const ctx =
    output.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  /*
    Normal image first.
  */

  ctx.drawImage(
    source,
    0,
    0
  );


  if (
    mode === "normal"
  ) {

    return output;

  }


  const image =
    ctx.getImageData(
      0,
      0,
      output.width,
      output.height
    );


  const data =
    image.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =

      0.299 * data[i] +

      0.587 * data[i + 1] +

      0.114 * data[i + 2];


    let value =
      gray;


    if (
      mode === "contrast"
    ) {

      value =
        (gray - 128) *
        2.0 +
        128;

    }


    else if (
      mode === "threshold130"
    ) {

      value =
        gray > 130
          ? 255
          : 0;

    }


    else if (
      mode === "threshold160"
    ) {

      value =
        gray > 160
          ? 255
          : 0;

    }


    else if (
      mode === "invert"
    ) {

      value =
        255 - gray;

    }


    value =
      Math.max(
        0,
        Math.min(
          255,
          value
        )
      );


    data[i] =
      value;


    data[i + 1] =
      value;


    data[i + 2] =
      value;

  }


  ctx.putImageData(
    image,
    0,
    0
  );


  return output;

}


/* =====================================================
   EXTRACT VIN CANDIDATES
===================================================== */

function extractCandidates(
  rawText
) {

  const results =
    new Set();


  /*
    CRITICAL:
    Every OCR line is processed separately.

    We NEVER join unrelated OCR lines.
  */

  const lines =
    String(
      rawText
    )
    .toUpperCase()
    .split(
      /\r?\n/
    );


  for (
    const originalLine of lines
  ) {

    if (
      !originalLine.trim()
    ) {

      continue;

    }


    let clean =
      originalLine
        .replace(
          /[^A-Z0-9]/g,
          ""
        );


    /*
      OCR corrections that are safe for VIN:
      I/O/Q do not exist in VINs.
    */

    clean =
      clean
        .replace(
          /I/g,
          "1"
        )
        .replace(
          /O/g,
          "0"
        )
        .replace(
          /Q/g,
          "0"
        );


    /*
      Exact 17-char result = best case.
    */

    if (
      clean.length === 17
    ) {

      if (
        looksLikeVIN(
          clean
        )
      ) {

        results.add(
          clean
        );

      }

      continue;

    }


    /*
      OCR may accidentally attach a couple
      characters before/after the VIN.

      Only allow a SMALL amount of noise.
    */

    if (
      clean.length >= 18 &&
      clean.length <= 21
    ) {

      for (
        let start = 0;
        start <=
          clean.length - 17;
        start++
      ) {

        const candidate =
          clean.substring(
            start,
            start + 17
          );


        if (
          looksLikeVIN(
            candidate
          )
        ) {

          results.add(
            candidate
          );

        }

      }

    }

  }


  return [
    ...results
  ];

}


/* =====================================================
   LOCAL VIN FILTER
===================================================== */

function looksLikeVIN(
  vin
) {

  /*
    Exactly 17 chars.

    VIN excludes I, O, Q.
  */

  if (
    !/^[A-HJ-NPR-Z0-9]{17}$/.test(
      vin
    )
  ) {

    return false;

  }


  /*
    Prevent nonsense such as repeating
    OCR characters.
  */

  const unique =
    new Set(
      vin.split("")
    );


  if (
    unique.size < 6
  ) {

    return false;

  }


  /*
    Position 10 is model-year code.
  */

  const yearCode =
    vin.charAt(9);


  if (
    !/^[A-HJ-NPR-TV-Y1-9]$/.test(
      yearCode
    )
  ) {

    return false;

  }


  return true;

}


/* =====================================================
   NHTSA VERIFICATION
===================================================== */

async function verifyVIN(
  vin
) {

  try {

    const url =

      "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/" +

      encodeURIComponent(
        vin
      ) +

      "?format=json";


    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      return null;

    }


    const data =
      await response.json();


    if (
      !data.Results ||
      data.Results.length === 0
    ) {

      return null;

    }


    const vehicle =
      data.Results[0];


    const year =
      String(
        vehicle.ModelYear || ""
      ).trim();


    const make =
      String(
        vehicle.Make || ""
      ).trim();


    const model =
      String(
        vehicle.Model || ""
      ).trim();


    /*
      THIS IS THE IMPORTANT SAFETY GATE.

      Garbage OCR is NOT accepted simply
      because NHTSA answered the request.

      We require actual decoded vehicle data.
    */

    if (
      !year ||
      !make
    ) {

      console.log(
        "Rejected VIN:",
        vin,
        "No useful vehicle data."
      );


      return null;

    }


    return {

      year:
        year,

      make:
        make,

      model:
        model

    };

  }

  catch (error) {

    console.log(
      "VIN verification error:",
      error
    );


    return null;

  }

}


/* =====================================================
   SUCCESS
===================================================== */

function lockVIN(
  vin,
  vehicle
) {

  scanning =
    false;


  verifying =
    false;


  detectedVIN =
    vin;


  detectedYear =
    vehicle.year;


  detectedMake =
    vehicle.make;


  detectedModel =
    vehicle.model;


  scanLine.style.display =
    "none";


  vinResult.innerText =
    detectedVIN;


  vehicleResult.innerText =
    [
      detectedYear,
      detectedMake,
      detectedModel
    ]
    .filter(
      Boolean
    )
    .join(
      " "
    );


  resultBox.style.display =
    "block";


  statusBox.innerText =
    "VIN verified successfully.";


  smallStatus.innerText =
    "Check the vehicle and continue.";


  confirmButton.style.display =
    "block";


  retryButton.style.display =
    "block";


  manualButton.style.display =
    "none";


  manualBox.style.display =
    "none";

}


/* =====================================================
   RETRY
===================================================== */

retryButton.addEventListener(
  "click",
  function() {

    scanning =
      false;


    setTimeout(
      function() {

        startAutomaticScan();

      },

      150
    );

  }
);


/* =====================================================
   MANUAL ENTRY
===================================================== */

manualButton.addEventListener(
  "click",
  function() {

    manualBox.style.display =
      manualBox.style.display === "block"
        ? "none"
        : "block";


    manualVIN.focus();

  }
);


manualVIN.addEventListener(
  "input",
  function() {

    this.value =
      this.value
        .toUpperCase()
        .replace(
          /[^A-HJ-NPR-Z0-9]/g,
          ""
        )
        .slice(
          0,
          17
        );

  }
);


manualSubmit.addEventListener(
  "click",
  async function() {

    const vin =
      manualVIN.value
        .trim()
        .toUpperCase();


    if (
      !looksLikeVIN(
        vin
      )
    ) {

      statusBox.innerText =
        "Enter a valid 17-character VIN.";

      return;

    }


    statusBox.innerText =
      "Verifying VIN...";


    const vehicle =
      await verifyVIN(
        vin
      );


    if (
      !vehicle
    ) {

      statusBox.innerText =
        "VIN could not be verified.";

      return;

    }


    lockVIN(
      vin,
      vehicle
    );

  }
);


/* =====================================================
   CONFIRM → APPSHEET
===================================================== */

confirmButton.addEventListener(
  "click",
  function() {

    if (
      !detectedVIN
    ) {

      return;

    }


    statusBox.innerText =
      "Opening receiving form...";


    const defaults = {

      "VIN":
        detectedVIN,

      "Year":
        detectedYear,

      "Make":
        detectedMake,

      "Model":
        detectedModel

    };


    const appUrl =

      "https://www.appsheet.com/start/" +

      APP_ID +

      "#control=" +

      encodeURIComponent(
        FORM_VIEW
      ) +

      "&defaults=" +

      encodeURIComponent(
        JSON.stringify(
          defaults
        )
      ) +

      "&page=form";


    window.location.href =
      appUrl;

  }
);

function sleep(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}

window.addEventListener(
  "load",
  startCamera
