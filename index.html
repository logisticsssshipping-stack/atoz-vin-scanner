<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>A-to-Z VIN Scanner</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#app {
  position: relative;
  width: 100%;
  height: 100dvh;
  background: #000;
}

#video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.shade {
  position: absolute;
  left: 0;
  right: 0;
  background: rgba(0,0,0,.55);
  pointer-events: none;
}

#shadeTop {
  top: 0;
  height: calc(50% - 70px);
}

#shadeBottom {
  bottom: 0;
  height: calc(50% - 70px);
}

#scanBox {
  position: absolute;
  left: 3%;
  width: 94%;
  height: 140px;

  top: 50%;
  transform: translateY(-50%);

  border: 3px solid #26e86f;
  border-radius: 12px;

  box-shadow:
    0 0 0 1px rgba(0,0,0,.4),
    0 0 25px rgba(38,232,111,.35);

  pointer-events: none;
}

#scanBox.processing {
  border-color: #ffd54a;
  box-shadow:
    0 0 25px rgba(255,213,74,.5);
}

#scanBox.found {
  border-color: #26e86f;
  box-shadow:
    0 0 35px rgba(38,232,111,.9);
}

#topBar {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  left: 0;
  width: 100%;

  z-index: 10;
  text-align: center;

  color: white;
  text-shadow: 0 2px 6px #000;
}

#title {
  font-size: 22px;
  font-weight: 900;
}

#instruction {
  margin-top: 7px;
  font-size: 14px;
}

#status {
  position: absolute;

  bottom: max(
    30px,
    calc(env(safe-area-inset-bottom) + 20px)
  );

  left: 5%;
  width: 90%;

  text-align: center;
  z-index: 10;
}

#statusText {
  display: inline-block;

  background: rgba(0,0,0,.78);
  color: white;

  padding: 11px 18px;

  border-radius: 999px;

  font-size: 15px;
  font-weight: 800;
}

#manualBtn {
  display: block;

  margin: 14px auto 0;

  border: 0;
  background: transparent;

  color: white;

  text-decoration: underline;

  font-size: 14px;
}

#resultCard {
  display: none;

  position: absolute;

  left: 5%;
  width: 90%;

  bottom: max(
    20px,
    calc(env(safe-area-inset-bottom) + 15px)
  );

  background: white;

  padding: 20px;

  border-radius: 18px;

  z-index: 20;

  box-shadow:
    0 12px 40px rgba(0,0,0,.5);
}

#successLabel {
  font-size: 13px;
  font-weight: 900;
  color: #128a43;
  letter-spacing: 1px;
}

#vinResult {
  margin-top: 7px;

  font-size: 22px;
  font-weight: 900;

  letter-spacing: 1px;

  word-break: break-all;
}

#vehicleResult {
  margin-top: 8px;

  font-size: 17px;
  font-weight: 700;

  color: #444;
}

#continueBtn {
  width: 100%;

  margin-top: 18px;

  padding: 15px;

  border: 0;
  border-radius: 12px;

  background: #111;
  color: white;

  font-size: 17px;
  font-weight: 900;
}

#manualPanel {
  display: none;

  position: absolute;

  inset: 0;

  z-index: 40;

  background: rgba(0,0,0,.93);

  align-items: center;
  justify-content: center;

  padding: 20px;
}

#manualCard {
  width: 100%;
  max-width: 450px;

  background: white;

  padding: 22px;

  border-radius: 18px;
}

#manualVin {
  width: 100%;

  padding: 14px;

  border: 2px solid #ccc;
  border-radius: 10px;

  font-size: 18px;

  text-transform: uppercase;
}

#manualSubmit,
#manualCancel {
  width: 100%;

  margin-top: 12px;

  padding: 14px;

  border-radius: 10px;

  font-size: 16px;
  font-weight: 800;
}

#manualSubmit {
  border: 0;

  background: #111;
  color: white;
}

#manualCancel {
  background: white;

  border: 1px solid #ccc;
}

#errorScreen {
  display: none;

  position: absolute;

  inset: 0;

  z-index: 100;

  background: #111;
  color: white;

  padding: 30px;

  align-items: center;
  justify-content: center;

  text-align: center;
}

canvas {
  display: none;
}
</style>
</head>

<body>

<div id="app">

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div
    id="shadeTop"
    class="shade"
  ></div>

  <div
    id="shadeBottom"
    class="shade"
  ></div>

  <div id="scanBox"></div>

  <div id="topBar">

    <div id="title">
      VIN SCANNER
    </div>

    <div id="instruction">
      Put the complete VIN inside the green box
    </div>

  </div>

  <div id="status">

    <div id="statusText">
      Starting camera...
    </div>

    <button id="manualBtn">
      Enter VIN manually
    </button>

  </div>

  <div id="resultCard">

    <div id="successLabel">
      VEHICLE FOUND
    </div>

    <div id="vinResult"></div>

    <div id="vehicleResult"></div>

    <button id="continueBtn">
      CONTINUE
    </button>

  </div>


  <div id="manualPanel">

    <div id="manualCard">

      <h2>
        Enter VIN
      </h2>

      <input
        id="manualVin"
        maxlength="17"
        autocomplete="off"
        spellcheck="false"
        autocapitalize="characters"
        placeholder="17-character VIN"
      >

      <button id="manualSubmit">
        CHECK VIN
      </button>

      <button id="manualCancel">
        CANCEL
      </button>

    </div>

  </div>


  <div id="errorScreen">

    <div>

      <h2>
        Camera unavailable
      </h2>

      <p id="errorText"></p>

    </div>

  </div>


  <canvas id="canvas"></canvas>

</div>


<script>

/* ================================================
   CONFIG
================================================ */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbxeFrEttl7fh8lmSzBJGO852xYTTsV5BrjHssoj2IK4biAhJLApLMs1qUIbbAlsbHWXsw/exec";


const APP_ID =
"c9b42286-9e3c-4647-a376-6b7823b93237";


const FORM_VIEW =
"A-to-Z Yard Inventory V1_Form";


const SCAN_DELAY = 700;

const JPEG_QUALITY = 0.92;


/* ================================================
   ELEMENTS
================================================ */

const video =
document.getElementById("video");

const scanBox =
document.getElementById("scanBox");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const status =
document.getElementById("status");

const statusText =
document.getElementById("statusText");


const resultCard =
document.getElementById("resultCard");

const vinResult =
document.getElementById("vinResult");

const vehicleResult =
document.getElementById("vehicleResult");


const continueBtn =
document.getElementById("continueBtn");


const manualBtn =
document.getElementById("manualBtn");

const manualPanel =
document.getElementById("manualPanel");

const manualVin =
document.getElementById("manualVin");

const manualSubmit =
document.getElementById("manualSubmit");

const manualCancel =
document.getElementById("manualCancel");


const errorScreen =
document.getElementById("errorScreen");

const errorText =
document.getElementById("errorText");


/* ================================================
   STATE
================================================ */

let stream = null;

let scanning = false;

let requestRunning = false;

let vehicleFound = false;

let detectedVehicle = null;

let scanTimer = null;


/* ================================================
   CAMERA
================================================ */

async function startCamera() {

  try {

    statusText.textContent =
      "Starting camera...";


    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    stream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    await new Promise(
      resolve => {

        video.onloadedmetadata =
          resolve;

      }
    );


    await video.play();


    await configureCamera();


    scanning = true;


    statusText.textContent =
      "Point at VIN";


    scheduleNextScan(
      600
    );

  }

  catch (error) {

    console.error(
      error
    );


    errorScreen.style.display =
      "flex";


    errorText.textContent =
      error.message ||
      "Please allow camera access.";

  }

}


/* ================================================
   CAMERA FOCUS
================================================ */

async function configureCamera() {

  try {

    const track =
      stream.getVideoTracks()[0];


    if (!track) {
      return;
    }


    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    const advanced = {};


    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.focusMode =
        "continuous";

    }


    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.exposureMode =
        "continuous";

    }


    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.whiteBalanceMode =
        "continuous";

    }


    if (
      Object.keys(
        advanced
      ).length
    ) {

      await track.applyConstraints({

        advanced: [
          advanced
        ]

      });

    }

  }

  catch (error) {

    console.log(
      "Camera advanced controls unavailable",
      error
    );

  }

}


/* ================================================
   CAPTURE GREEN BOX
================================================ */

function captureVinImage() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return null;

  }


  const videoRect =
    video.getBoundingClientRect();


  const boxRect =
    scanBox.getBoundingClientRect();


  const sourceWidth =
    video.videoWidth;


  const sourceHeight =
    video.videoHeight;


  const displayedWidth =
    videoRect.width;


  const displayedHeight =
    videoRect.height;


  /*
    object-fit: cover mapping
  */

  const scale =
    Math.max(

      displayedWidth /
        sourceWidth,

      displayedHeight /
        sourceHeight

    );


  const renderedWidth =
    sourceWidth *
    scale;


  const renderedHeight =
    sourceHeight *
    scale;


  const cropOffsetX =
    (
      renderedWidth -
      displayedWidth
    ) / 2;


  const cropOffsetY =
    (
      renderedHeight -
      displayedHeight
    ) / 2;


  const visibleX =
    boxRect.left -
    videoRect.left;


  const visibleY =
    boxRect.top -
    videoRect.top;


  let sourceX =
    (
      visibleX +
      cropOffsetX
    ) / scale;


  let sourceY =
    (
      visibleY +
      cropOffsetY
    ) / scale;


  let cropWidth =
    boxRect.width /
    scale;


  let cropHeight =
    boxRect.height /
    scale;


  /*
    Add extra vertical area.

    This gives Gemini more context and avoids
    losing tops/bottoms of VIN characters.
  */

  const verticalPadding =
    cropHeight *
    0.28;


  sourceY -=
    verticalPadding;


  cropHeight +=
    verticalPadding *
    2;


  /*
    Add slight horizontal padding too.
  */

  const horizontalPadding =
    cropWidth *
    0.02;


  sourceX -=
    horizontalPadding;


  cropWidth +=
    horizontalPadding *
    2;


  sourceX =
    Math.max(
      0,
      sourceX
    );


  sourceY =
    Math.max(
      0,
      sourceY
    );


  cropWidth =
    Math.min(

      cropWidth,

      sourceWidth -
      sourceX

    );


  cropHeight =
    Math.min(

      cropHeight,

      sourceHeight -
      sourceY

    );


  /*
    Upscale for OCR
  */

  const targetWidth =
    1800;


  const ratio =
    targetWidth /
    cropWidth;


  const targetHeight =
    Math.max(

      300,

      Math.round(
        cropHeight *
        ratio
      )

    );


  canvas.width =
    targetWidth;


  canvas.height =
    targetHeight;


  ctx.imageSmoothingEnabled =
    true;


  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    video,

    sourceX,
    sourceY,

    cropWidth,
    cropHeight,

    0,
    0,

    targetWidth,
    targetHeight

  );


  return canvas.toDataURL(

    "image/jpeg",

    JPEG_QUALITY

  );

}


/* ================================================
   SCAN LOOP
================================================ */

function scheduleNextScan(
  delay = SCAN_DELAY
) {

  clearTimeout(
    scanTimer
  );


  if (
    !scanning ||
    vehicleFound
  ) {

    return;

  }


  scanTimer =
    setTimeout(

      scanFrame,

      delay

    );

}


async function scanFrame() {

  if (
    !scanning ||
    vehicleFound ||
    requestRunning
  ) {

    return;

  }


  const image =
    captureVinImage();


  if (!image) {

    scheduleNextScan(
      400
    );

    return;

  }


  requestRunning =
    true;


  scanBox.classList.add(
    "processing"
  );


  statusText.textContent =
    "Reading VIN...";


  try {

    const result =
      await sendToBackend(
        image
      );


    console.log(
      "SCAN RESULT:",
      result
    );


    if (
      result &&
      result.success === true &&
      result.found === true &&
      isValidVin(
        result.vin
      )
    ) {

      lockVehicle(
        result
      );

      return;

    }


   if (result && result.raw) {
  statusText.textContent =
    "Gemini: " + result.raw;
}
else if (result && result.error) {
  statusText.textContent =
    "ERROR: " + result.error;
}
else {
  statusText.textContent =
    "NOT FOUND";
}

  }

  catch (error) {

    console.error(
      "Scan request failed:",
      error
    );


    statusText.textContent =
      "Trying again...";

  }

  finally {

    requestRunning =
      false;


    scanBox.classList.remove(
      "processing"
    );


    if (
      !vehicleFound
    ) {

      scheduleNextScan();

    }

  }

}


/* ================================================
   BACKEND
================================================ */

async function sendToBackend(
  image
) {

  const response =
    await fetch(
      BACKEND_URL,
      {

        method: "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action:
              "scanVin",

            image:
              image

          }),

        redirect:
          "follow"

      }
    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Backend HTTP " +
      response.status
    );

  }


  try {

    return JSON.parse(
      text
    );

  }

  catch (error) {

    console.error(
      "RAW BACKEND RESPONSE:",
      text
    );


    throw new Error(
      "Backend returned invalid JSON."
    );

  }

}


/* ================================================
   VALID VIN
================================================ */

function isValidVin(
  vin
) {

  if (!vin) {

    return false;

  }


  vin =
    String(vin)
      .trim()
      .toUpperCase();


  return /^[A-HJ-NPR-Z0-9]{17}$/
    .test(vin);

}


/* ================================================
   SUCCESS
================================================ */

function lockVehicle(
  vehicle
) {

  vehicleFound =
    true;


  scanning =
    false;


  detectedVehicle =
    vehicle;


  clearTimeout(
    scanTimer
  );


  scanBox.classList.remove(
    "processing"
  );


  scanBox.classList.add(
    "found"
  );


  status.style.display =
    "none";


  vinResult.textContent =
    vehicle.vin;


  const description =
    [

      vehicle.year,

      vehicle.make,

      vehicle.model

    ]

    .filter(Boolean)

    .join(" ");


  vehicleResult.textContent =
    description ||
    "VIN detected";


  resultCard.style.display =
    "block";


  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        120
      );

    }

  }

  catch (_) {}

}


/* ================================================
   APPSHEET
================================================ */

function openAppSheet() {

  if (
    !detectedVehicle
  ) {

    return;

  }


  const defaults = {

    VIN:
      detectedVehicle.vin,

    Year:
      detectedVehicle.year || "",

    Make:
      detectedVehicle.make || "",

    Model:
      detectedVehicle.model || ""

  };


  const appUrl =

    "https://www.appsheet.com/start/" +

    APP_ID +

    "#control=" +

    encodeURIComponent(
      FORM_VIEW
    ) +

    "&defaults=" +

    encodeURIComponent(

      JSON.stringify(
        defaults
      )

    ) +

    "&page=form";


  window.location.href =
    appUrl;

}


continueBtn.addEventListener(

  "click",

  openAppSheet

);


/* ================================================
   MANUAL VIN
================================================ */

manualBtn.addEventListener(

  "click",

  () => {

    manualPanel.style.display =
      "flex";


    manualVin.value =
      "";


    setTimeout(

      () =>
        manualVin.focus(),

      100

    );

  }

);


manualCancel.addEventListener(

  "click",

  () => {

    manualPanel.style.display =
      "none";

  }

);


manualVin.addEventListener(

  "input",

  () => {

    manualVin.value =
      manualVin.value

        .toUpperCase()

        .replace(
          /[^A-HJ-NPR-Z0-9]/g,
          ""
        )

        .slice(
          0,
          17
        );

  }

);


manualSubmit.addEventListener(

  "click",

  checkManualVin

);


manualVin.addEventListener(

  "keydown",

  event => {

    if (
      event.key === "Enter"
    ) {

      checkManualVin();

    }

  }

);


async function checkManualVin() {

  const vin =
    manualVin.value
      .trim()
      .toUpperCase();


  if (
    !isValidVin(vin)
  ) {

    alert(
      "VIN must be exactly 17 valid characters."
    );

    return;

  }


  manualSubmit.disabled =
    true;


  manualSubmit.textContent =
    "CHECKING...";


  try {

    const response =
      await fetch(
        BACKEND_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "decodeVin",

              vin:
                vin

            })

        }
      );


    const result =
      await response.json();


    if (
      result &&
      result.success
    ) {

      manualPanel.style.display =
        "none";


      lockVehicle(
        result
      );

      return;

    }


    alert(
      "VIN could not be decoded."
    );

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      "VIN check failed."
    );

  }

  finally {

    manualSubmit.disabled =
      false;


    manualSubmit.textContent =
      "CHECK VIN";

  }

}


/* ================================================
   START
================================================ */

window.addEventListener(

  "load",

  startCamera

);


window.addEventListener(

  "pagehide",

  () => {

    scanning =
      false;


    clearTimeout(
      scanTimer
    );


    if (
      stream
    ) {

      stream
        .getTracks()
        .forEach(

          track =>
            track.stop()

        );

    }

  }

);

</script>

</body>
</html>
