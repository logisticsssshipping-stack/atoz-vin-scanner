<script>

/*
====================================================
CONFIGURATION
====================================================
*/

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbxeFrEttl7fh8lmSzBJGO852xYTTsV5BrjHssoj2IK4biAhJLApLMs1qUIbbAlsbHWXsw/exec";

const SCAN_INTERVAL = 250;

const JPEG_QUALITY = 0.88;

const APPSHEET_APP_ID =
  "c9b42286-9e3c-4647-a376-6b7823b93237";

const APPSHEET_FORM_VIEW =
  "A-to-Z Yard Inventory V1_Form";


/*
====================================================
ELEMENTS
====================================================
*/

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("captureCanvas");

const scanArea =
  document.getElementById("scanArea");

const statusText =
  document.getElementById("status");

const resultText =
  document.getElementById("result");

const vehicleInfo =
  document.getElementById("vehicleInfo");

const detailsText =
  document.getElementById("details");

const restartButton =
  document.getElementById("restartButton");

const addInventoryButton =
  document.getElementById("addInventoryButton");


/*
====================================================
STATE
====================================================
*/

let scanning = false;

let locked = false;

let timer = null;

let cameraStream = null;

let detectedVehicle = {
  vin: "",
  year: "",
  make: "",
  model: ""
};


/*
====================================================
START CAMERA
====================================================
*/

async function startCamera() {

  try {

    statusText.textContent =
      "Opening camera...";

    detailsText.textContent = "";

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera is not supported by this browser."
      );

    }


    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    cameraStream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );

    video.srcObject =
      cameraStream;

    await video.play();

    await waitForVideo();

    await tryCameraEnhancements(
      cameraStream
    );

    statusText.textContent =
      "Point at VIN";

    detailsText.textContent =
      "Cloud Vision scanner ready";

    scanning = true;

    locked = false;

    scheduleNextScan(500);

  }

  catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );

    statusText.textContent =
      "Camera error";

    detailsText.textContent =
      error.message ||
      String(error);

  }

}


/*
====================================================
WAIT FOR CAMERA
====================================================
*/

function waitForVideo() {

  return new Promise(
    function(resolve) {

      if (
        video.videoWidth > 0 &&
        video.videoHeight > 0
      ) {

        resolve();
        return;

      }

      video.addEventListener(
        "loadedmetadata",

        function() {
          resolve();
        },

        {
          once: true
        }

      );

    }
  );

}


/*
====================================================
CAMERA ENHANCEMENTS
====================================================
*/

async function tryCameraEnhancements(
  stream
) {

  try {

    const track =
      stream.getVideoTracks()[0];

    if (!track) {
      return;
    }

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};

    const advanced = {};


    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        "continuous"
      )
    ) {

      advanced.focusMode =
        "continuous";

    }


    if (
      capabilities.exposureMode &&
      capabilities.exposureMode.includes(
        "continuous"
      )
    ) {

      advanced.exposureMode =
        "continuous";

    }


    if (
      capabilities.whiteBalanceMode &&
      capabilities.whiteBalanceMode.includes(
        "continuous"
      )
    ) {

      advanced.whiteBalanceMode =
        "continuous";

    }


    if (
      Object.keys(advanced).length > 0
    ) {

      await track.applyConstraints({

        advanced: [
          advanced
        ]

      });

    }

  }

  catch (error) {

    console.log(
      "Camera enhancement skipped:",
      error
    );

  }

}


/*
====================================================
CAPTURE GREEN BOX
====================================================
*/

function captureVinArea() {

  const videoRect =
    video.getBoundingClientRect();

  const scanRect =
    scanArea.getBoundingClientRect();

  const sourceWidth =
    video.videoWidth;

  const sourceHeight =
    video.videoHeight;


  if (
    !sourceWidth ||
    !sourceHeight
  ) {

    throw new Error(
      "Camera not ready."
    );

  }


  const scale =
    Math.max(

      videoRect.width /
        sourceWidth,

      videoRect.height /
        sourceHeight

    );


  const displayedWidth =
    sourceWidth * scale;

  const displayedHeight =
    sourceHeight * scale;


  const offsetX =
    (
      displayedWidth -
      videoRect.width
    ) / 2;

  const offsetY =
    (
      displayedHeight -
      videoRect.height
    ) / 2;


  let x =
    (
      scanRect.left -
      videoRect.left +
      offsetX
    ) / scale;


  let y =
    (
      scanRect.top -
      videoRect.top +
      offsetY
    ) / scale;


  let width =
    scanRect.width /
    scale;


  let height =
    scanRect.height /
    scale;


  const horizontalPadding =
    width * 0.04;

  const verticalPadding =
    height * 0.15;


  x -= horizontalPadding;

  y -= verticalPadding;

  width +=
    horizontalPadding * 2;

  height +=
    verticalPadding * 2;


  x =
    Math.max(
      0,
      x
    );


  y =
    Math.max(
      0,
      y
    );


  width =
    Math.min(
      width,
      sourceWidth - x
    );


  height =
    Math.min(
      height,
      sourceHeight - y
    );


  const targetWidth = 1400;


  const outputScale =
    Math.max(
      1,
      targetWidth / width
    );


  canvas.width =
    Math.round(
      width * outputScale
    );


  canvas.height =
    Math.round(
      height * outputScale
    );


  const ctx =
    canvas.getContext("2d");


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(

    video,

    x,
    y,

    width,
    height,

    0,
    0,

    canvas.width,
    canvas.height

  );


  return canvas.toDataURL(
    "image/jpeg",
    JPEG_QUALITY
  );

}


/*
====================================================
SEND IMAGE TO BACKEND
====================================================
*/

async function sendImage(
  imageData
) {

  const response =
    await fetch(

      BACKEND_URL,

      {

        method: "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action: "scanVin",

            image: imageData

          }),

        redirect: "follow"

      }

    );


  if (!response.ok) {

    throw new Error(
      "Backend HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  try {

    return JSON.parse(text);

  }

  catch (error) {

    console.error(
      "INVALID BACKEND RESPONSE:",
      text
    );

    throw new Error(
      "Backend returned invalid JSON."
    );

  }

}


/*
====================================================
LOCAL VIN VALIDATION
====================================================
*/

function isValidVin(
  vin
) {

  return (

    typeof vin === "string" &&

    /^[A-HJ-NPR-Z0-9]{17}$/
      .test(vin)

  );

}


/*
====================================================
AUTOMATIC SCANNER
====================================================
*/

async function scanFrame() {

  if (
    !scanning ||
    locked
  ) {

    return;

  }


  try {

    statusText.textContent =
      "Reading VIN...";


    const image =
      captureVinArea();


    const result =
      await sendImage(image);


    console.log(
      "BACKEND RESULT:",
      result
    );


    /*
    ================================================
    VIN FOUND
    ================================================
    */

    if (
      result &&
      result.success === true &&
      result.found === true &&
      isValidVin(result.vin)
    ) {

      lockVin(result);

      return;

    }


    /*
    ================================================
    NO VIN FOUND
    ================================================
    */

    if (
      result &&
      result.success === true &&
      result.found === false
    ) {

      statusText.textContent =
        "Point at VIN";


      if (
        result.visionText
      ) {

        detailsText.textContent =
          "Vision saw: " +
          result.visionText;

      }

      else if (
        result.ocr
      ) {

        detailsText.textContent =
          "Vision saw: " +
          result.ocr;

      }

      else {

        detailsText.textContent =
          "Vision found no text";

      }

    }


    /*
    ================================================
    BACKEND ERROR
    ================================================
    */

    else if (
      result &&
      result.success === false
    ) {

      statusText.textContent =
        "Backend error";

      detailsText.textContent =
        result.error ||
        "Unknown backend error";

    }

  }

  catch (error) {

    console.error(
      "SCANNER ERROR:",
      error
    );

    statusText.textContent =
      "Scanner error";

    detailsText.textContent =
      error.message ||
      String(error);

  }


  scheduleNextScan(
    SCAN_INTERVAL
  );

}


/*
====================================================
SCHEDULE NEXT SCAN
====================================================
*/

function scheduleNextScan(
  delay
) {

  clearTimeout(timer);

  timer =
    setTimeout(
      scanFrame,
      delay
    );

}


/*
====================================================
VIN DETECTED
====================================================
*/

function lockVin(
  result
) {

  locked = true;

  scanning = false;

  clearTimeout(timer);


  /*
  ================================================
  SAVE ALL BACKEND INFORMATION
  ================================================
  */

  detectedVehicle = {

    vin:
      String(
        result.vin || ""
      ).trim(),

    year:
      String(
        result.year || ""
      ).trim(),

    make:
      String(
        result.make || ""
      ).trim(),

    model:
      String(
        result.model || ""
      ).trim()

  };


  /*
  ================================================
  SHOW VIN
  ================================================
  */

  statusText.textContent =
    "VIN DETECTED ✓";

  resultText.textContent =
    detectedVehicle.vin;


  /*
  ================================================
  SHOW YEAR + MAKE + MODEL
  ================================================
  */

  const vehicleParts = [];


  if (
    detectedVehicle.year
  ) {

    vehicleParts.push(
      detectedVehicle.year
    );

  }


  if (
    detectedVehicle.make
  ) {

    vehicleParts.push(
      detectedVehicle.make
    );

  }


  if (
    detectedVehicle.model
  ) {

    vehicleParts.push(
      detectedVehicle.model
    );

  }


  if (
    vehicleParts.length > 0
  ) {

    vehicleInfo.textContent =
      vehicleParts.join(" • ");

    vehicleInfo.style.display =
      "block";

    detailsText.textContent =
      "Verify vehicle information before adding";

  }

  else {

    vehicleInfo.textContent =
      "Vehicle details unavailable";

    vehicleInfo.style.display =
      "block";

    detailsText.textContent =
      "VIN detected successfully";

  }


  /*
  ================================================
  SHOW BUTTONS
  ================================================
  */

  restartButton.style.display =
    "block";

  addInventoryButton.style.display =
    "block";


  /*
  ================================================
  VIBRATE
  ================================================
  */

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [
        100,
        60,
        100
      ]
    );

  }

}


/*
====================================================
SCAN AGAIN
====================================================
*/

restartButton.addEventListener(

  "click",

  function() {

    locked = false;

    scanning = true;


    detectedVehicle = {
      vin: "",
      year: "",
      make: "",
      model: ""
    };


    resultText.textContent = "";

    vehicleInfo.textContent = "";

    vehicleInfo.style.display =
      "none";


    detailsText.textContent =
      "Cloud Vision scanner ready";

    statusText.textContent =
      "Point at VIN";


    restartButton.style.display =
      "none";

    addInventoryButton.style.display =
      "none";


    scheduleNextScan(300);

  }

);


/*
====================================================
ADD TO INVENTORY
====================================================
*/

addInventoryButton.addEventListener(

  "click",

  function() {

    if (!detectedVehicle.vin) {
      return;
    }


    /*
    ================================================
    BUILD APPSHEET DEFAULT VALUES
    ================================================
    */

    const defaults = {

      "VIN":
        detectedVehicle.vin,

      "Year":
        detectedVehicle.year,

      "Make":
        detectedVehicle.make,

      "Model":
        detectedVehicle.model

    };


    /*
    ================================================
    BUILD VERIFIED APPSHEET LINKTOFORM URL
    ================================================
    */

    const appUrl =

      "https://www.appsheet.com/start/" +

      APPSHEET_APP_ID +

      "#control=" +

      encodeURIComponent(
        APPSHEET_FORM_VIEW
      ) +

      "&defaults=" +

      encodeURIComponent(
        JSON.stringify(defaults)
      );


    console.log(
      "OPENING APPSHEET:",
      appUrl
    );


    statusText.textContent =
      "Opening inventory form...";


    /*
    ================================================
    STOP CAMERA BEFORE LEAVING
    ================================================
    */

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          function(track) {
            track.stop();
          }
        );

    }


    /*
    ================================================
    OPEN APPSHEET
    ================================================
    */

    window.location.href =
      appUrl;

  }

);


/*
====================================================
START
====================================================
*/

window.addEventListener(
  "load",
  startCamera
);

</script>
